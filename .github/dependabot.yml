version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
# Version updates wait seven days after a release, matching uv's exclude-newer and npm's
# min-release-age; security updates are not delayed.
updates:
  # Actions are pinned by commit with the version as a comment; Dependabot updates both.
  # The second directory holds the composite actions of this repository.
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 7
  - package-ecosystem: "uv"
    directories: ["/", "/reference-platform/services"]
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/packages/webui"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 7
    ignore:
      # The current TypeScript ESLint parser supports TypeScript below 6.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Heartwood targets the Node 24 runtime and its matching type definitions.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directories:
      - "/images"
      - "/images/platform"
      - "/images/worker/candidate"
      - "/reference-platform/images/funnel"
      - "/reference-platform/services"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 7
    ignore:
      # Base image tags change only with a reviewed platform or runtime migration.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "opentofu"
    directory: "/reference-platform/infrastructure/gke"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
    cooldown:
      default-days: 7
