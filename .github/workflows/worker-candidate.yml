name: Worker Dependency Candidate

on:
  pull_request:
    paths:
      - .github/workflows/worker-candidate.yml
      - deploy/build-worker-candidate.py
      - images/worker/candidate/**
      - packages/**
      - vendor/heartwood-skills
      - pyproject.toml
      - LICENSE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify candidate wheel reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install pinned build tools
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.13.7
          python-version: 3.12.15
      - name: Build twice from verified sources
        run: |
          uv run --no-project --python 3.12.15 deploy/build-worker-candidate.py --output test-results/worker-candidate/first
          uv run --no-project --python 3.12.15 deploy/build-worker-candidate.py --output test-results/worker-candidate/second
          cmp test-results/worker-candidate/first/build-record.json test-results/worker-candidate/second/build-record.json
          uv run --no-project --python 3.12.15 deploy/build-worker-candidate.py --application --output test-results/worker-candidate/application-first
          uv run --no-project --python 3.12.15 deploy/build-worker-candidate.py --application --output test-results/worker-candidate/application-second
          cmp test-results/worker-candidate/application-first/application-build-record.json test-results/worker-candidate/application-second/application-build-record.json
      - name: Verify the candidate environment lock
        run: |
          bash images/worker/candidate/runtime.sh compile test-results/worker-candidate/first
          git diff --exit-code -- images/worker/candidate/runtime-requirements.txt
      - name: Install the candidate qualification environment
        run: bash images/worker/candidate/runtime.sh install test-results/worker-candidate/first test-results/worker-candidate/application-first test-results/worker-candidate/environment
      - name: Test the installed application and worker candidate
        env:
          OPENHANDS_SUPPRESS_BANNER: '1'
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: |
          test-results/worker-candidate/environment/bin/python -I -m pytest --no-cov -q
      - name: Retain qualification artifacts
        uses: actions/upload-artifact@v7
        with:
          name: worker-dependency-candidate-${{ github.sha }}
          path: |
            test-results/worker-candidate/first/
            test-results/worker-candidate/application-first/
          retention-days: 14
