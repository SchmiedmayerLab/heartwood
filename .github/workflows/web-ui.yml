name: Web UI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-ui:
    name: TypeScript, Unit, And Browser Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/webui/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install dependencies
        working-directory: packages/webui
        run: npm ci
      - name: Install the pinned Python toolchain
        run: uv python install
      - name: Prepare maintained runtime dependencies
        run: uv run --no-project --python 3.12.15 deploy/build-worker-candidate.py --bootstrap
      - name: Install the Python workspace
        run: uv sync --locked --all-extras
      - name: Check generated API contracts
        working-directory: packages/webui
        run: npm run contracts:check
      - name: Check formatting
        working-directory: packages/webui
        run: npm run format:check
      - name: Lint
        working-directory: packages/webui
        run: npm run lint
      - name: Check production duplication
        working-directory: packages/webui
        run: npm run duplicates:check
      - name: Type-check
        working-directory: packages/webui
        run: npm run typecheck
      - name: Run unit tests
        working-directory: packages/webui
        run: npm run test
      - name: Check npm licenses
        working-directory: packages/webui
        run: npm run license:check
      - name: Audit npm dependencies
        working-directory: packages/webui
        # GHSA-fc5q-39xc-vjpf affects every picomatch release. picomatch reaches the web UI only through
        # @schmiedmayerlab/grove-design-system -> next-intl -> @parcel/watcher, which only next-intl's Next.js plugin
        # and message extractor load; the web UI is a Vite app and loads neither. The exemption holds only while
        # npm audit lists @parcel/watcher as picomatch's sole dependent, and only until its review date, after which the
        # audit fails again. Remove it once picomatch publishes a fix, or re-check the path and move the date.
        env:
          EXEMPT_ADVISORIES: '{"GHSA-fc5q-39xc-vjpf": {"dependents": ["@parcel/watcher"], "until": "2026-12-17"}}'
        run: |
          npm audit --omit=dev --json > "${RUNNER_TEMP}/npm-audit.json" || true
          node - "${RUNNER_TEMP}/npm-audit.json" <<'EOF'
          const report = JSON.parse(require('fs').readFileSync(process.argv[2], 'utf8'));
          const { error, vulnerabilities } = report;
          if (error || typeof vulnerabilities !== 'object' || vulnerabilities === null || Array.isArray(vulnerabilities)) {
            throw new Error(`npm audit failed: ${JSON.stringify(error)}`);
          }
          const exempt = JSON.parse(process.env.EXEMPT_ADVISORIES);
          let failed = false;
          for (const vulnerability of Object.values(report.vulnerabilities)) {
            for (const advisory of vulnerability.via) {
              if (typeof advisory !== 'object' || !['moderate', 'high', 'critical'].includes(advisory.severity)) continue;
              const { dependents, until } = exempt[advisory.url.split('/').pop()] ?? {};
              const { isDirect, effects } = report.vulnerabilities[advisory.name];
              const reviewDate = new Date(`${until}T23:59:59Z`);
              const current = typeof until === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(until) && !Number.isNaN(reviewDate.getTime())
                && reviewDate.toISOString().startsWith(until) && reviewDate >= new Date();
              if (current && Array.isArray(dependents) && !isDirect && effects.length > 0 && effects.every((dependent) => dependents.includes(dependent))) {
                console.log(`::notice::Exempted ${advisory.name} until ${until}: ${advisory.url}`);
              } else {
                if (until && !current) console.error(`Exemption for ${advisory.url} has passed or invalid review date ${until}; re-check it.`);
                console.error(`${advisory.severity} ${advisory.name}: ${advisory.title} ${advisory.url}`);
                failed = true;
              }
            }
          }
          process.exit(failed ? 1 : 0);
          EOF
      - name: Install Playwright Chromium
        working-directory: packages/webui
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke test
        working-directory: packages/webui
        run: npm run test:e2e
      - name: Run gateway-served proxy smoke test
        run: npm run test:gateway --prefix packages/webui
      - name: Run Jupyter proxy smoke test
        run: npm run test:jupyter-proxy --prefix packages/webui
      - name: Run real browser and CLI reference analysis
        env:
          HEARTWOOD_REFERENCE_SCREENSHOT_DIR: ${{ runner.temp }}/heartwood-reference-screenshots
        run: npm run test:reference-analysis --prefix packages/webui
