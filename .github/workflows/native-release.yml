name: Native Release Assets

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build And Verify Native Assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - name: Install pinned dependency builder
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/webui/package-lock.json
      - name: Build native assets
        env:
          RELEASE_VERSION: ${{ github.sha }}
        run: deploy/package-native.sh dist "${RELEASE_VERSION}"
      - name: Verify local installer path
        run: >-
          dist/heartwood-installer
          --bundle dist/heartwood-native.tar.gz
          --checksums dist/SHA256SUMS
          --root "${RUNNER_TEMP}/heartwood"
          --platform generic
          --dry-run
      - name: Test native installation layout
        run: deploy/tests/native_installer_smoke.sh dist
      - name: Test installation from empty Ubuntu
        run: >-
          docker run --rm --platform linux/amd64
          --volume "${PWD}:/source:ro"
          --workdir /source
          ubuntu:24.04
          bash deploy/tests/native_installer_ubuntu_smoke.sh dist
      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: heartwood-native-assets
          path: |
            dist/heartwood-installer
            dist/heartwood-native.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
