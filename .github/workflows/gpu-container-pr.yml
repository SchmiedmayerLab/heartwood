name: Terra GPU Qualification Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-gpu-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate GPU image contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate GPU runtime contract
        uses: ./.github/actions/validate-gpu-contract

  publish:
    name: Publish And Validate Terra Candidate
    needs: contract
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set candidate image reference
        id: candidate
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_name=${image_name}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image_name}:candidate-sha-${GITHUB_SHA}-terra-gpu-nvidia" >> "${GITHUB_OUTPUT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Terra candidate by digest
        id: build
        uses: docker/bake-action@v7
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
          DOCKER_BUILD_RECORD_UPLOAD: false
          GIT_SHA: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          provenance: false
          sbom: false
          source: .
          targets: terra-runtime-gpu-nvidia
          set: |
            terra-runtime-gpu-nvidia.tags=${{ steps.candidate.outputs.image_name }}
            terra-runtime-gpu-nvidia.output=type=image,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false
      - name: Record Terra candidate digest
        id: staged
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          IMAGE_NAME: ${{ steps.candidate.outputs.image_name }}
        run: |
          printf '%s\n' "${BUILD_METADATA}" > /tmp/terra-candidate-metadata.json
          digest="$(
            python3 images/scripts/read_buildx_digest.py \
              /tmp/terra-candidate-metadata.json terra-runtime-gpu-nvidia
          )"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "reference=${IMAGE_NAME}@${digest}" >> "${GITHUB_OUTPUT}"
      - name: Validate staged Terra candidate
        env:
          CANDIDATE: ${{ steps.staged.outputs.reference }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          bash images/gpu/validate_image_candidate.sh \
            "${CANDIDATE}" terra-runtime-gpu-nvidia "${EXPECTED_REVISION}"
      - name: Create immutable Terra candidate tag
        env:
          CANDIDATE_DIGEST: ${{ steps.staged.outputs.digest }}
          CANDIDATE_REFERENCE: ${{ steps.staged.outputs.reference }}
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          if inspect="$(docker buildx imagetools inspect "${CANDIDATE_TAG}" 2>/dev/null)"; then
            tag_digest="$(awk '$1 == "Digest:" {print $2; exit}' <<<"${inspect}")"
          else
            docker buildx imagetools create --prefer-index=false \
              --tag "${CANDIDATE_TAG}" "${CANDIDATE_REFERENCE}"
            inspect="$(docker buildx imagetools inspect "${CANDIDATE_TAG}")"
            tag_digest="$(awk '$1 == "Digest:" {print $2; exit}' <<<"${inspect}")"
          fi
          if [ "${tag_digest}" != "${CANDIDATE_DIGEST}" ]; then
            echo "immutable Terra candidate tag does not match the validated digest" >&2
            exit 1
          fi
          raw="$(docker buildx imagetools inspect --raw "${CANDIDATE_TAG}")"
          jq --exit-status '
            .mediaType == "application/vnd.docker.distribution.manifest.v2+json"
            and .config.mediaType == "application/vnd.docker.container.image.v1+json"
          ' <<<"${raw}" >/dev/null
          {
            echo "### Terra qualification candidate"
            echo
            echo "\`${CANDIDATE_TAG}\`"
            echo
            echo "Revision: \`${EXPECTED_REVISION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
