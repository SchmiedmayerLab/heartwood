name: Kubernetes Qualification

# The image and cluster jobs download the wheels and the gateway that the Worker
# Dependency Candidate workflow built in the same run, so a caller runs this workflow
# after it.
on:
  workflow_call:
    outputs:
      observations:
        description: Immutable observation artifact IDs by stage.
        value: ${{ jobs.cluster.outputs.platform }}:${{ jobs.cluster.outputs.hosted }}:${{ jobs.cluster.outputs.worker }}
    inputs:
      published-images:
        description: Install the six published images for this commit by digest.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scope:
    name: Select the cluster stage for changed inputs
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.inputs.outputs.required }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: true
      # The scope is decided here, so a caller sees success when the cluster jobs are skipped.
      - name: Compare a pull request with its base
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          required=true
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            required=false
            changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
            while IFS= read -r path; do
              case "${path}" in
                packages/gateway/* | packages/schemas/* | images/* | deploy/* | reference-platform/* | \
                  .github/workflows/pull-request-validation.yml | \
                  .github/workflows/worker-candidate.yml | \
                  .github/workflows/kubernetes-qualification.yml)
                  required=true
                  ;;
              esac
            done <<<"${changed}"
          fi
          echo "required=${required}" >> "${GITHUB_OUTPUT}"

  # The images are built once and passed to each cluster job as an artifact.
  images:
    name: Prepare the cluster images
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download the published digest record
        if: inputs.published-images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-platform-images-${{ github.sha }}
          path: test-results
      - name: Require the published record for this commit
        if: inputs.published-images
        run: jq --exit-status --arg commit "${GITHUB_SHA}" '.commit == $commit' test-results/published-images.json
      - name: Checkout repository
        if: ${{ !inputs.published-images }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Download candidate wheels
        if: ${{ !inputs.published-images }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: worker-dependency-candidate-${{ github.sha }}
          path: test-results/worker-candidate
      - name: Build and check candidate images
        if: ${{ !inputs.published-images }}
        run: bash images/worker/build-candidate-images.sh test-results/worker-candidate "${GITHUB_SHA}"
      - name: Build the platform services image
        if: ${{ !inputs.published-images }}
        run: >-
          docker build --file reference-platform/services/Dockerfile
          --tag heartwood-platform-services:candidate .
      - name: Build the Funnel image
        if: ${{ !inputs.published-images }}
        run: >-
          python3 reference-platform/tools/prepare_funnel.py "${RUNNER_TEMP}/funnel"
          --image heartwood-funnel:candidate
      - name: Save the images
        if: ${{ !inputs.published-images }}
        run: |
          mkdir -p "${RUNNER_TEMP}/cluster-images"
          docker save --output "${RUNNER_TEMP}/cluster-images/images.tar" \
            heartwood-worker:qualification heartwood-runtime:qualification \
            heartwood-hosted-gateway:qualification heartwood-platform-services:candidate \
            heartwood-funnel:candidate
      - name: Retain the images for the cluster jobs
        if: ${{ !inputs.published-images }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kubernetes-qualification-images-${{ github.sha }}
          path: ${{ runner.temp }}/cluster-images/images.tar
          if-no-files-found: error
          retention-days: 1
          # Fast compression keeps the upload of the image archive short.
          compression-level: 1

  # Each stage runs on its own kind cluster with the same images and chart, so the
  # stages run in parallel. A cluster test module that is not named here runs in the
  # platform stage.
  cluster:
    name: Kubernetes qualification of the ${{ matrix.stage }} stage
    needs: [scope, images]
    outputs:
      platform: ${{ steps.receipt.outputs.platform }}
      hosted: ${{ steps.receipt.outputs.hosted }}
      worker: ${{ steps.receipt.outputs.worker }}
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: platform
            tests: >-
              ../tests/cluster
              --ignore=../tests/cluster/test_hub_spawning.py
              --ignore=../tests/cluster/test_hosted_recovery.py
              --ignore=../tests/cluster/test_hosted_worker.py
              --ignore=../tests/cluster/test_end_to_end.py
          - stage: hosted
            tests: >-
              ../tests/cluster/test_hub_spawning.py
              ../tests/cluster/test_hosted_recovery.py
              ../tests/cluster/test_hosted_worker.py
              ../tests/cluster/test_end_to_end.py
          - stage: worker
            tests: ""
    env:
      QUALIFICATION_STAGE: ${{ matrix.stage }}
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      KUBECTL_VERSION: v1.37.0
      KUBECTL_SHA256: 6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f
      HELM_VERSION: v4.3.2
      HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install kind, kubectl and Helm
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl --fail --silent --show-error --location --retry 3 --output "${RUNNER_TEMP}/bin/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl --fail --silent --show-error --location --retry 3 --output "${RUNNER_TEMP}/bin/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --silent --show-error --location --retry 3 --output "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "${KIND_SHA256}" "${RUNNER_TEMP}/bin/kind" \
            "${KUBECTL_SHA256}" "${RUNNER_TEMP}/bin/kubectl" \
            "${HELM_SHA256}" "${RUNNER_TEMP}/helm.tar.gz" | sha256sum --check
          tar --extract --gzip --file "${RUNNER_TEMP}/helm.tar.gz" --directory "${RUNNER_TEMP}/bin" \
            --strip-components 1 linux-amd64/helm
          chmod +x "${RUNNER_TEMP}/bin/kind" "${RUNNER_TEMP}/bin/kubectl"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      # Only the chart tests run uv.
      - name: Install uv
        if: inputs.published-images || matrix.stage != 'worker'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Download the pinned gateway build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: worker-gateway-candidate-${{ github.sha }}
          path: test-results/gateway-candidate
      - name: Download the images
        if: ${{ !inputs.published-images }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kubernetes-qualification-images-${{ github.sha }}
          path: ${{ runner.temp }}/cluster-images
      - name: Load the images
        if: ${{ !inputs.published-images }}
        run: |
          docker load --input "${RUNNER_TEMP}/cluster-images/images.tar"
          rm -rf "${RUNNER_TEMP}/cluster-images"
      - name: Create the kind cluster with Calico and Agent Sandbox
        run: bash reference-platform/cluster/create-cluster.sh heartwood
      - name: Require network policy enforcement
        run: >-
          bash reference-platform/cluster/network-policy-controls.sh heartwood
          test-results/kubernetes-qualification
      - name: Push the platform services image to the cluster registry
        if: ${{ !inputs.published-images }}
        run: |
          image="$(bash reference-platform/cluster/push-image.sh heartwood \
            heartwood-platform-services:candidate)"
          echo "PLATFORM_SERVICES_IMAGE=${image}" >> "${GITHUB_ENV}"
      - name: Push the Funnel image to the cluster registry
        if: ${{ !inputs.published-images }}
        run: |
          image="$(bash reference-platform/cluster/push-image.sh heartwood heartwood-funnel:candidate)"
          echo "FUNNEL_IMAGE=${image}" >> "${GITHUB_ENV}"
      - name: Push the hosted gateway image to the cluster registry
        if: ${{ !inputs.published-images }}
        run: |
          image="$(bash reference-platform/cluster/push-image.sh heartwood \
            heartwood-hosted-gateway:qualification)"
          echo "HOSTED_GATEWAY_IMAGE=${image}" >> "${GITHUB_ENV}"
      # llama-server of the local model runs from the runtime image.
      - name: Push the runtime image to the cluster registry
        if: ${{ !inputs.published-images }}
        run: |
          image="$(bash reference-platform/cluster/push-image.sh heartwood \
            heartwood-runtime:qualification)"
          echo "MODEL_RUNTIME_IMAGE=${image}" >> "${GITHUB_ENV}"
      - name: Download the published digest record
        if: inputs.published-images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-platform-images-${{ github.sha }}
          path: test-results/kubernetes-qualification
      - name: Select the verified platform images
        if: inputs.published-images
        run: |
          record=test-results/kubernetes-qualification/published-images.json
          jq --exit-status --arg commit "${GITHUB_SHA}" '.commit == $commit' "${record}"
          ref() { jq --raw-output --arg name "$1" '.images[$name] | .repository + "@" + .digest' "${record}"; }
          {
            echo "MODEL_RUNTIME_IMAGE=$(ref runtime)"
            echo "PUBLISHED_WORKER_IMAGE=$(ref worker)"
            echo "PUBLISHED_GATEWAY_IMAGE=$(ref sandbox-gateway)"
          } >> "${GITHUB_ENV}"
      - name: Build the gateway and controller images and push them with the worker and OpenShell images
        run: |
          runtime=heartwood-runtime:qualification
          gateway=()
          if [[ -n "${PUBLISHED_GATEWAY_IMAGE:-}" ]]; then
            runtime="${MODEL_RUNTIME_IMAGE}"
            gateway=(--published-gateway "${PUBLISHED_GATEWAY_IMAGE}")
            docker pull "${PUBLISHED_GATEWAY_IMAGE}"
            docker pull "${PUBLISHED_WORKER_IMAGE}"
            docker pull "${MODEL_RUNTIME_IMAGE}"
          fi
          python3 deploy/qualify-kubernetes-worker.py images --cluster heartwood "${gateway[@]}" \
            --worker-image "${PUBLISHED_WORKER_IMAGE:-heartwood-worker:qualification}" \
            --runtime-image "${runtime}" \
            --gateway-artifacts test-results/gateway-candidate \
            --output test-results/kubernetes-qualification/worker
          images=test-results/kubernetes-qualification/worker/images.json
          {
            echo "GATEWAY_IMAGE=$(jq --raw-output .image_references.gateway "${images}")"
            echo "WORKER_IMAGE=$(jq --raw-output .image_references.worker "${images}")"
            echo "STAGING_IMAGES=$(jq --compact-output \
              '[.image_references.worker, .image_references.replacement_worker]' "${images}")"
            echo "OPENSHELL_REPOSITORY=$(jq --raw-output .openshell_repository "${images}")"
            echo "WORKER_INTERPRETER=$(jq --compact-output '[.worker_interpreter]' "${images}")"
          } >> "${GITHUB_ENV}"
      # Sessions run the built gateway, their pods pull the OpenShell release images from
      # the cluster's registry, and staging pods run the worker image or its replacement.
      # The worker's interpreter is the program that may send the model route's key.
      - name: Install the chart from the verified published digests
        if: inputs.published-images
        run: |
          record=test-results/kubernetes-qualification/published-images.json
          jq --exit-status --argjson observed "${WORKER_INTERPRETER}" \
            '[.worker_interpreter] == $observed' "${record}"
          output=test-results/kubernetes-qualification/worker
          python3 reference-platform/tools/oci_identity.py --context kind-heartwood \
            --images "${output}/images.json" --output "${output}/runtime-manifests.json"
          jq '{hub:{worker:{runtimeImages:.}}}' "${output}/runtime-manifests.json" > "${output}/admission-values.json"
          bash reference-platform/cluster/install-chart.sh heartwood \
            --values test-results/kubernetes-qualification/published-values.yaml --values "${output}/admission-values.json" \
            --set "images.openshellRepository=${OPENSHELL_REPOSITORY}" \
            --set-json "sessions.stagingImages=${STAGING_IMAGES}"
      - name: Install the platform chart
        if: ${{ !inputs.published-images }}
        run: >-
          bash reference-platform/cluster/install-chart.sh heartwood
          --set "images.platformServices=${PLATFORM_SERVICES_IMAGE}"
          --set "images.openshellGateway=${GATEWAY_IMAGE}"
          --set "images.openshellRepository=${OPENSHELL_REPOSITORY}"
          --set "images.hostedGateway=${HOSTED_GATEWAY_IMAGE}"
          --set "images.modelRuntime=${MODEL_RUNTIME_IMAGE}"
          --set "images.funnel=${FUNNEL_IMAGE}"
          --set "hub.worker.image=${WORKER_IMAGE}"
          --set-json "sessions.stagingImages=${STAGING_IMAGES}"
          --set-json "hub.modelRoute.binaries=${WORKER_INTERPRETER}"
      - name: Test the installed chart
        if: matrix.stage != 'worker'
        working-directory: reference-platform/services
        env:
          TESTS: ${{ matrix.tests }}
          PUBLISHED_IMAGE_RECORD: >-
            ${{ inputs.published-images && matrix.stage == 'hosted' &&
            format('{0}/test-results/kubernetes-qualification/published-images.json', github.workspace) || '' }}
        run: |
          read -ra tests <<<"${TESTS}"
          uv sync --locked
          # Tests replace the control pod, so its logs are followed into the evidence meanwhile.
          while :; do
            kubectl --context kind-heartwood --namespace heartwood-platform logs --follow \
              --timestamps pod/heartwood-control-0 || true
            sleep 2
          done >> ../../test-results/kubernetes-qualification/control.log 2>&1 &
          uv run pytest -c pyproject.toml "${tests[@]}" --cluster-context kind-heartwood \
            --staging-image "${WORKER_IMAGE}" \
            --junitxml ../../test-results/kubernetes-qualification/platform-chart.xml
      - name: Qualify managed workers on the Kubernetes driver
        if: matrix.stage == 'worker'
        env:
          PUBLISHED: ${{ inputs.published-images }}
        run: |
          output=test-results/kubernetes-qualification/worker
          args=()
          if [[ "${PUBLISHED}" == true ]]; then
            args=(--runtime-manifests "${output}/runtime-manifests.json")
          fi
          python3 deploy/qualify-kubernetes-worker.py run --cluster heartwood --output "${output}" "${args[@]}"
      - name: Verify the evidence for this commit
        if: matrix.stage == 'worker'
        run: >-
          python3 deploy/qualification_evidence.py
          test-results/kubernetes-qualification/worker --commit "${GITHUB_SHA}"
      - name: Observe the published images on this stage's cluster
        if: inputs.published-images && matrix.stage != 'hosted'
        working-directory: reference-platform/services
        env:
          PUBLISHED_IMAGE_RECORD: ${{ github.workspace }}/test-results/kubernetes-qualification/published-images.json
        run: |
          uv sync --locked
          uv run pytest -c pyproject.toml --cluster-context kind-heartwood --staging-image "${WORKER_IMAGE}" \
            ../tests/cluster/test_hosted_worker.py::test_the_gateway_discovers_the_route_models_with_its_discovery_key \
            ../tests/cluster/test_hosted_worker.py::test_an_approved_tool_call_runs_in_the_worker_through_the_model_route
      - name: Retain observed published image identities
        if: inputs.published-images
        id: observed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: observed-platform-images-${{ matrix.stage }}-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/kubernetes-qualification/observed-images.json
          if-no-files-found: error
          retention-days: 90
      - name: Record the uploaded observation ID
        id: receipt
        if: inputs.published-images
        env:
          ARTIFACT_ID: ${{ steps.observed.outputs.artifact-id }}
        run: |
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]] || exit 1
          echo "${QUALIFICATION_STAGE}=${ARTIFACT_ID}" >> "${GITHUB_OUTPUT}"
      - name: Export cluster logs
        if: failure()
        run: kind export logs test-results/kubernetes-qualification/kind-logs --name heartwood
      - name: Retain the cluster evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kubernetes-qualification-${{ matrix.stage }}-${{ github.sha }}
          path: |
            test-results/kubernetes-qualification/
            !test-results/kubernetes-qualification/worker/gateway/
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}

  # The check of the whole stage, which passes when the stage was not required or every
  # cluster job passed.
  qualification:
    name: Kubernetes qualification
    needs: [scope, images, cluster]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every cluster job
        env:
          REQUIRED: ${{ needs.scope.outputs.required }}
          RESULTS: ${{ toJson(needs) }}
        run: |
          if [[ "${REQUIRED}" == "true" ]]; then
            jq --exit-status 'to_entries | all(.value.result == "success")' <<<"${RESULTS}"
          else
            jq --exit-status '.scope.result == "success"' <<<"${RESULTS}"
          fi
