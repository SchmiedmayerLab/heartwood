name: GPU Container Image

on:
  workflow_call:

concurrency:
  group: gpu-container-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate GPU image contracts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Validate GPU runtime contract
        uses: ./.github/actions/validate-gpu-contract

  build:
    name: Build And Validate ${{ matrix.target }}
    needs: contract
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime-gpu-nvidia
            runner: ubuntu-24.04
            commit_suffix: gpu-nvidia
            diagnostic_name: generic GPU commit tag
            flatten: "false"
            validation_mode: linux-amd64-index
            media_output: type=image,push-by-digest=true,name-canonical=true,push=true
          - target: terra-runtime-gpu-nvidia
            runner: blacksmith-16vcpu-ubuntu-2404
            commit_suffix: terra-gpu-nvidia
            diagnostic_name: Terra GPU commit tag
            flatten: "true"
            validation_mode: docker-v2
            media_output: type=image,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate by digest
        id: build
        uses: docker/bake-action@v7
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
          DOCKER_BUILD_RECORD_UPLOAD: false
          GIT_SHA: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          source: .
          targets: ${{ matrix.target }}
          set: |
            ${{ matrix.target }}.tags=${{ steps.image.outputs.name }}
            ${{ matrix.target }}.output=${{ matrix.media_output }}
      - name: Record candidate digest
        id: candidate
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          TARGET: ${{ matrix.target }}
        run: |
          printf '%s\n' "${BUILD_METADATA}" > /tmp/gpu-metadata.json
          digest="$(python3 images/scripts/read_buildx_digest.py /tmp/gpu-metadata.json "${TARGET}")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "reference=${IMAGE_NAME}@${digest}" >> "${GITHUB_OUTPUT}"
      - name: Verify candidate contents and interfaces
        env:
          CANDIDATE: ${{ steps.candidate.outputs.reference }}
          EXPECTED_REVISION: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          bash images/gpu/validate_image_candidate.sh \
            "${CANDIDATE}" "${TARGET}" "${EXPECTED_REVISION}"
      - name: Create and verify immutable commit tag
        uses: ./.github/actions/create-immutable-image-tag
        with:
          candidate-tag: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.commit_suffix }}
          candidate-references: ${{ steps.candidate.outputs.reference }}
          candidate-digest: ${{ steps.candidate.outputs.digest }}
          diagnostic-name: ${{ matrix.diagnostic_name }}
          flatten: ${{ matrix.flatten }}
          validation-mode: ${{ matrix.validation_mode }}

  promote:
    name: Promote GPU Channel Tags
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check GPU moving-tag ownership
        id: main-revision
        uses: ./.github/actions/check-current-main
        with:
          expected-sha: ${{ github.sha }}
      - name: Promote validated generic and Terra tags
        if: steps.main-revision.outputs.current == 'true'
        env:
          GIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          for tuple in \
            "gpu-nvidia edge-gpu-nvidia false" \
            "terra-gpu-nvidia edge-terra-gpu-nvidia true"; do
            read -r suffix channel flatten <<<"${tuple}"
            commit_ref="${IMAGE_NAME}:sha-${GIT_SHA}-${suffix}"
            commit_digest="$(docker buildx imagetools inspect "${commit_ref}" | awk '$1 == "Digest:" {print $2; exit}')"
            create_args=()
            if [ "${flatten}" = "true" ]; then
              create_args+=(--prefer-index=false)
            fi
            docker buildx imagetools create "${create_args[@]}" \
              --tag "${IMAGE_NAME}:${channel}" "${commit_ref}"
            channel_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${channel}" | awk '$1 == "Digest:" {print $2; exit}')"
            if [ "${channel_digest}" != "${commit_digest}" ]; then
              echo "promoted ${channel} digest does not match ${commit_ref}" >&2
              exit 1
            fi
          done
