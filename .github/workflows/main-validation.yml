name: Main Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  containers:
    name: Container Images
    uses: ./.github/workflows/container-image.yml
  documentation:
    name: Documentation
    uses: ./.github/workflows/documentation.yml
  capable-model:
    name: Capable Model Acceptance
    uses: ./.github/workflows/capable-model.yml
  gpu-containers:
    name: GPU Container Images
    uses: ./.github/workflows/gpu-container-image.yml
  native-assets:
    name: Native Release Assets
    uses: ./.github/workflows/native-release.yml
  native-qualification:
    name: Native Worker Qualification
    uses: ./.github/workflows/worker-candidate.yml
  evidence-attestation:
    name: Attest Native Qualification Evidence
    needs: native-qualification
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout the qualified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: true
      - name: Download the retained evidence
        uses: actions/download-artifact@v8
        with:
          name: worker-native-qualification-${{ github.sha }}
          path: test-results/native-qualification
      - name: Verify the evidence for this commit
        run: >-
          python3 deploy/qualification_evidence.py
          test-results/native-qualification --commit "${GITHUB_SHA}"
      - name: Attest the evidence checksums
        uses: actions/attest@v4
        with:
          subject-path: test-results/native-qualification/SHA256SUMS
  python:
    name: Python
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/python.yml
  secrets:
    name: Secret Scan
    uses: ./.github/workflows/gitleaks.yml
  validation:
    name: Repository Validation
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/validate.yml
  web-ui:
    name: Web UI
    uses: ./.github/workflows/web-ui.yml
  release-ready:
    name: Release Candidate Ready
    if: ${{ always() }}
    needs:
      - capable-model
      - containers
      - documentation
      - evidence-attestation
      - gpu-containers
      - native-assets
      - native-qualification
      - python
      - secrets
      - validation
      - web-ui
    runs-on: ubuntu-24.04
    steps:
      - name: Require every validation workflow
        env:
          VALIDATION_RESULTS: ${{ toJson(needs) }}
        run: |
          jq --exit-status 'to_entries | all(.value.result == "success")' \
            <<<"${VALIDATION_RESULTS}"
