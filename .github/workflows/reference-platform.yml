name: Reference Platform

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Keep cloud-specific and platform code out of application packages
        run: python3 reference-platform/tools/check_cloud_boundary.py

  services:
    name: Platform service tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: reference-platform/services
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the platform services (locked)
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check ..
      - name: Lint
        run: uv run ruff check --output-format=github ..
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest
