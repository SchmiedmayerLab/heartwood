name: Reference Platform

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Keep cloud-specific and platform code out of application packages
        run: python3 reference-platform/tools/check_cloud_boundary.py
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      # Offline checks only: the backend is skipped and no provider is configured,
      # so no cloud credential is used or contacted.
      - name: Check the GKE infrastructure code
        working-directory: reference-platform/infrastructure/gke
        run: |
          tofu fmt -check -recursive -diff
          tofu init -backend=false -input=false -lockfile=readonly
          tofu validate

  services:
    name: Platform service tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HELM_VERSION: v4.3.2
      HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
    defaults:
      run:
        working-directory: reference-platform/services
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Install Helm
        run: |
          curl --fail --silent --show-error --location --retry 3 --output "${RUNNER_TEMP}/helm.tar.gz" \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "${HELM_SHA256}" "${RUNNER_TEMP}/helm.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/bin"
          tar --extract --gzip --file "${RUNNER_TEMP}/helm.tar.gz" --directory "${RUNNER_TEMP}/bin" \
            --strip-components 1 linux-amd64/helm
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install the platform services (locked)
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check ..
      - name: Lint
        run: uv run ruff check --output-format=github ..
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      # Pulls the pinned OpenShell chart, verifies its digest and renders it again.
      - name: Compare the committed OpenShell objects with a fresh render
        run: uv run python ../tools/render_openshell.py --check

  funnel:
    name: Funnel image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      # Verifies the source tree and the patch digests, runs the tests of the patched packages and builds the image.
      - name: Build Funnel with its recorded patches
        run: >-
          python3 reference-platform/tools/prepare_funnel.py "${RUNNER_TEMP}/funnel"
          --image heartwood-funnel:candidate --test
