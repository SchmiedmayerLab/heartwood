name: Pull Request Validation

on:
  pull_request:

concurrency:
  group: pull-request-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capable-model:
    name: Capable Model Acceptance
    uses: ./.github/workflows/capable-model.yml
  documentation:
    name: Documentation
    uses: ./.github/workflows/documentation.yml
  container-smoke:
    name: Container Smoke Tests
    uses: ./.github/workflows/container-smoke.yml
  gpu-containers:
    name: GPU Container Candidates
    uses: ./.github/workflows/gpu-container-pr-validation.yml
  kubernetes-qualification:
    name: Kubernetes Qualification
    # The cluster stage uses the wheels and the gateway of the candidate build.
    needs: native-qualification
    uses: ./.github/workflows/kubernetes-qualification.yml
  native-assets:
    name: Native Release Assets
    uses: ./.github/workflows/native-release.yml
  native-qualification:
    name: Native Worker Qualification
    uses: ./.github/workflows/worker-candidate.yml
  python:
    name: Python
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/python.yml
  reference-platform:
    name: Reference Platform
    uses: ./.github/workflows/reference-platform.yml
  secrets:
    name: Secret Scan
    uses: ./.github/workflows/gitleaks.yml
  validation:
    name: Repository Validation
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/validate.yml
  web-ui:
    name: Web UI
    uses: ./.github/workflows/web-ui.yml
  release-ready:
    name: Release Candidate Ready
    if: ${{ always() }}
    needs:
      - capable-model
      - container-smoke
      - documentation
      - gpu-containers
      - kubernetes-qualification
      - native-assets
      - native-qualification
      - python
      - reference-platform
      - secrets
      - validation
      - web-ui
    runs-on: ubuntu-24.04
    steps:
      - name: Require every pull-request validation workflow
        env:
          VALIDATION_RESULTS: ${{ toJson(needs) }}
        run: |
          jq --exit-status 'to_entries | all(.value.result == "success")' \
            <<<"${VALIDATION_RESULTS}"
