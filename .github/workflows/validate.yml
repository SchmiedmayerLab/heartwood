name: Validate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skill-source:
    name: Verify Curated Skill Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Verify pinned clean source
        shell: bash
        run: |
          expected="$(git rev-parse HEAD:vendor/heartwood-skills)"
          actual="$(git -C vendor/heartwood-skills rev-parse HEAD)"
          test "${actual}" = "${expected}"
          test -z "$(git -C vendor/heartwood-skills status --short)"
          test "$(git config -f .gitmodules --get submodule.vendor/heartwood-skills.url)" = \
            "https://github.com/SchmiedmayerLab/heartwood-skills.git"
  model-sources:
    name: Verify Catalog Model Sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Verify immutable Hugging Face revisions
        run: python3 deploy/verify_model_sources.py --source-root . --allow-unavailable
  reuse:
    name: REUSE Compliance
    uses: SchmiedmayerLab/.github/.github/workflows/reuse.yml@v0.5
  actionlint:
    name: Lint GitHub Actions Workflows
    uses: SchmiedmayerLab/.github/.github/workflows/actionlint.yml@v0.5
  markdown-links:
    name: Check Markdown Links
    permissions:
      contents: read
      pull-requests: read
    uses: SchmiedmayerLab/.github/.github/workflows/markdown-links.yml@v0.5
  yamllint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7
      - name: Install yamllint
        run: pip install yamllint==1.38.0
      - name: Run yamllint
        run: yamllint -c .yamllint.yml .
  whitespace:
    name: Check Whitespace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Check trailing whitespace
        run: |
          python3 - <<'PYTHON'
          import re
          import subprocess

          result = subprocess.run(
              ["git", "grep", "-nI", "[[:blank:]]$", "--", "."],
              capture_output=True, text=True,
          )
          if result.returncode not in (0, 1):
              raise SystemExit(result.stderr or "Could not inspect tracked files")
          # A unified diff represents an empty context line with exactly one space.
          context = re.compile(r"images/worker/candidate/[a-z-]+\.patch:[0-9]+: ")
          invalid = [line for line in result.stdout.splitlines() if not context.fullmatch(line)]
          if invalid:
              raise SystemExit("Trailing whitespace found:\n" + "\n".join(invalid))
          PYTHON
