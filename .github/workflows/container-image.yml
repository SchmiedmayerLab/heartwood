name: Container Image

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Stage and validate generic image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and stage image by digest
        id: build
        uses: docker/bake-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          GIT_SHA: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          source: .
          targets: runtime
          set: |
            runtime.platform=${{ matrix.platform }}
            runtime.tags=${{ steps.image.outputs.name }}
            runtime.cache-from=type=gha,scope=runtime-${{ matrix.suffix }}
            runtime.cache-to=type=gha,scope=runtime-${{ matrix.suffix }},mode=min
            runtime.output=type=image,push-by-digest=true,name-canonical=true,push=true
      - name: Record staged image digest
        id: candidate
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          printf '%s\n' "${BUILD_METADATA}" > /tmp/metadata.json
          digest="$(python3 images/scripts/read_buildx_digest.py /tmp/metadata.json runtime)"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "reference=${IMAGE_NAME}@${digest}" >> "${GITHUB_OUTPUT}"
      - name: Pull staged generic candidate
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: docker pull --platform "${DOCKER_PLATFORM}" "${CANDIDATE_REFERENCE}"
      - name: Verify staged generic candidate revision
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
          DOCKER_PLATFORM: ${{ matrix.platform }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: >-
          bash images/scripts/verify_image_revision.sh
          "${CANDIDATE_REFERENCE}"
          "${DOCKER_PLATFORM}"
          "${EXPECTED_REVISION}"
      - name: Run staged host-user bind-mount smoke
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: >-
          bash images/generic/scripts/bind_mount_user_smoke.sh
          "${CANDIDATE_REFERENCE}"
          "${DOCKER_PLATFORM}"
      - name: Run staged generic OpenHands smoke
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: >-
          docker run --rm --init --platform "${DOCKER_PLATFORM}"
          --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges=true --pids-limit 256
          --tmpfs /tmp:rw,nosuid,nodev,size=1g
          --tmpfs /home/heartwood/.cache:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700
          --tmpfs /home/heartwood/.openhands:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
          "${CANDIDATE_REFERENCE}"
          bash /opt/heartwood/images/generic/scripts/offline_stack_smoke.sh
      - name: Download and verify CI-only model fixture
        run: |
          mkdir -p /tmp/heartwood-model
          curl --fail --location --show-error --retry 5 \
            https://huggingface.co/ggml-org/models-moved/resolve/96f460f/tinyllamas/stories260K.gguf \
            --output /tmp/heartwood-model/stories260K.gguf
          test "$(stat --format=%s /tmp/heartwood-model/stories260K.gguf)" -eq 1185376
          echo "270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  /tmp/heartwood-model/stories260K.gguf" | sha256sum --check -
      - name: Run staged generic local inference smoke
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
          DOCKER_PLATFORM: ${{ matrix.platform }}
        run: >-
          docker run --rm --init --platform "${DOCKER_PLATFORM}"
          --network none --read-only
          --cap-drop ALL --security-opt no-new-privileges=true --pids-limit 256
          --tmpfs /tmp:rw,nosuid,nodev,size=1g
          --tmpfs /home/heartwood/.cache:rw,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700
          --tmpfs /home/heartwood/.openhands:rw,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
          --volume /tmp/heartwood-model:/models:ro
          --env HEARTWOOD_LOCAL_MODEL_PATH=/models/stories260K.gguf
          "${CANDIDATE_REFERENCE}"
          bash /opt/heartwood/images/generic/scripts/local_inference_smoke.sh
      - name: Upload validated image digest
        uses: actions/upload-artifact@v7
        with:
          name: generic-digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Promote validated multi-platform generic image
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: generic-digest-*
          path: /tmp/digests
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect validated generic image references
        id: candidates
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          sources=()
          for digest in /tmp/digests/*; do
            digest_value="$(basename "${digest}")"
            [[ "${digest_value}" =~ ^[0-9a-f]{64}$ ]]
            sources+=("${IMAGE_NAME}@sha256:${digest_value}")
          done
          test "${#sources[@]}" -eq 2
          echo "references=${sources[*]}" >> "${GITHUB_OUTPUT}"
      - name: Create and verify immutable generic commit tag
        id: commit
        uses: ./.github/actions/create-immutable-image-tag
        with:
          candidate-tag: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          candidate-references: ${{ steps.candidates.outputs.references }}
          diagnostic-name: generic commit tag
          validation-mode: linux-multi-platform-index
      - name: Check generic moving-tag ownership
        id: main-revision
        uses: ./.github/actions/check-current-main
        with:
          expected-sha: ${{ github.sha }}
      - name: Promote generic moving tag
        if: steps.main-revision.outputs.current == 'true'
        env:
          COMMIT_DIGEST: ${{ steps.commit.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_CHANNEL: edge
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_CHANNEL}" \
            "${IMAGE_NAME}:sha-${GIT_SHA}"
          inspect_output="$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_CHANNEL}")"
          edge_digest="$(awk '$1 == "Digest:" {print $2; exit}' <<<"${inspect_output}")"
          if [ "${edge_digest}" != "${COMMIT_DIGEST}" ]; then
            echo "promoted generic channel digest does not match the immutable commit tag" >&2
            exit 1
          fi
          docker pull --platform linux/amd64 "${IMAGE_NAME}:${IMAGE_CHANNEL}"

  build-terra:
    name: Stage, validate, and promote Terra image (linux/amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and stage Terra image by digest
        id: build
        uses: docker/bake-action@v7
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
          DOCKER_BUILD_RECORD_UPLOAD: false
          GIT_SHA: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          source: .
          targets: terra-runtime
          set: |
            terra-runtime.tags=${{ steps.image.outputs.name }}
            terra-runtime.cache-from=type=gha,scope=terra-runtime-amd64
            terra-runtime.cache-to=type=gha,scope=terra-runtime-amd64,mode=min
            terra-runtime.output=type=image,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false
      - name: Record staged Terra image digest
        id: candidate
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          printf '%s\n' "${BUILD_METADATA}" > /tmp/terra-metadata.json
          digest="$(python3 images/scripts/read_buildx_digest.py /tmp/terra-metadata.json terra-runtime)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "reference=${IMAGE_NAME}@${digest}" >> "${GITHUB_OUTPUT}"
      - name: Verify staged Terra registry contract
        env:
          CANDIDATE_DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: >-
          python3 images/platform/scripts/verify_registry_manifest.py
          --manifest images/platforms.toml
          --platform terra
          --image-name "${IMAGE_NAME}"
          --reference "${CANDIDATE_DIGEST}"
      - name: Pull staged Terra candidate
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
        run: docker pull --platform linux/amd64 "${CANDIDATE_REFERENCE}"
      - name: Verify staged Terra candidate revision
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: >-
          bash images/scripts/verify_image_revision.sh
          "${CANDIDATE_REFERENCE}"
          linux/amd64
          "${EXPECTED_REVISION}"
      - name: Run staged Terra Jupyter contract smoke
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
        run: >-
          docker run --rm --platform linux/amd64 --network none
          --entrypoint bash
          "${CANDIDATE_REFERENCE}"
          /opt/heartwood/images/platform/scripts/terra_jupyter_contract_smoke.sh
      - name: Run staged Terra current-directory persistence smoke
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
        run: >-
          bash images/platform/scripts/terra_project_persistence_smoke.sh
          "${CANDIDATE_REFERENCE}"
      - name: Run staged Terra OpenHands smoke
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
        run: >-
          docker run --rm --platform linux/amd64 --network none
          --entrypoint bash
          --env HEARTWOOD_SMOKE_PROJECT=/home/jupyter/synthetic-agent-analysis
          --env HEARTWOOD_TERRA_DEMO_PROJECT_ROOT=/home/jupyter/synthetic-notebook-analysis
          "${CANDIDATE_REFERENCE}"
          /opt/heartwood/images/generic/scripts/offline_stack_smoke.sh
      - name: Download and verify CI-only model fixture
        run: |
          mkdir -p /tmp/heartwood-model
          curl --fail --location --show-error --retry 5 \
            https://huggingface.co/ggml-org/models-moved/resolve/96f460f/tinyllamas/stories260K.gguf \
            --output /tmp/heartwood-model/stories260K.gguf
          test "$(stat --format=%s /tmp/heartwood-model/stories260K.gguf)" -eq 1185376
          echo "270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  /tmp/heartwood-model/stories260K.gguf" | sha256sum --check -
      - name: Prepare staged Terra CI-only model fixture
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
        run: >-
          docker run --rm --platform linux/amd64
          --volume heartwood-terra-managed-project:/home/jupyter
          --env GOOGLE_PROJECT=heartwood-ci
          --env CLUSTER_NAME=terra-ci-model-safety-smoke
          --env WORKSPACE_ID=terra-ci-model-safety-smoke
          --entrypoint bash
          "${CANDIDATE_REFERENCE}"
          -c 'mkdir -p /home/jupyter/model-analysis &&
          cd /home/jupyter/model-analysis &&
          exec heartwood models download llama-cpp-stories260k-ci'
      - name: Verify staged Terra CI-only model remains non-agent
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
        run: >-
          docker run --rm --platform linux/amd64 --network none
          --workdir /home/jupyter/model-analysis --entrypoint bash
          --volume heartwood-terra-managed-project:/home/jupyter
          --env GOOGLE_PROJECT=heartwood-ci
          --env CLUSTER_NAME=terra-ci-model-safety-smoke
          --env WORKSPACE_ID=terra-ci-model-safety-smoke
          "${CANDIDATE_REFERENCE}"
          /opt/heartwood/images/platform/scripts/terra_ci_model_safety_smoke.sh
      - name: Remove staged Terra managed project
        if: always()
        run: docker volume rm --force heartwood-terra-managed-project
      - name: Run staged Terra local inference smoke
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
        run: >-
          docker run --rm --platform linux/amd64 --network none
          --workdir /opt/heartwood --entrypoint bash
          --volume /tmp/heartwood-model:/models:ro
          --env HEARTWOOD_LOCAL_MODEL_PATH=/models/stories260K.gguf
          "${CANDIDATE_REFERENCE}"
          images/generic/scripts/local_inference_smoke.sh
      - name: Run staged Terra Jupyter and internal gateway smoke
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
        run: >-
          bash images/platform/scripts/terra_jupyter_launch_smoke.sh
          "${CANDIDATE_REFERENCE}"
      - name: Run staged Terra Leonardo Jupyter and internal gateway smoke
        env:
          CANDIDATE_REFERENCE: ${{ steps.candidate.outputs.reference }}
          HEARTWOOD_TERRA_HOST_PORT: "8001"
          HEARTWOOD_TERRA_JUPYTER_MODE: leonardo
        run: >-
          bash images/platform/scripts/terra_jupyter_launch_smoke.sh
          "${CANDIDATE_REFERENCE}"
      - name: Create and verify immutable Terra commit tag
        id: commit
        uses: ./.github/actions/create-immutable-image-tag
        with:
          candidate-tag: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-terra
          candidate-references: ${{ steps.candidate.outputs.reference }}
          candidate-digest: ${{ steps.candidate.outputs.digest }}
          diagnostic-name: Terra commit tag
          flatten: "true"
          validation-mode: docker-v2
      - name: Verify immutable Terra registry contract
        env:
          GIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          python3 images/platform/scripts/verify_registry_manifest.py \
            --manifest images/platforms.toml \
            --platform terra \
            --image-name "${IMAGE_NAME}" \
            --reference "sha-${GIT_SHA}-terra"
      - name: Check Terra moving-tag ownership
        id: main-revision
        uses: ./.github/actions/check-current-main
        with:
          expected-sha: ${{ github.sha }}
      - name: Promote Terra moving tag
        if: steps.main-revision.outputs.current == 'true'
        env:
          COMMIT_DIGEST: ${{ steps.commit.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_CHANNEL: edge
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "${IMAGE_NAME}:${IMAGE_CHANNEL}-terra" \
            "${IMAGE_NAME}:sha-${GIT_SHA}-terra"
          inspect_output="$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_CHANNEL}-terra")"
          edge_digest="$(awk '$1 == "Digest:" {print $2; exit}' <<<"${inspect_output}")"
          if [ "${edge_digest}" != "${COMMIT_DIGEST}" ]; then
            echo "promoted Terra channel digest does not match the immutable commit tag" >&2
            exit 1
          fi
          python3 images/platform/scripts/verify_registry_manifest.py \
            --manifest images/platforms.toml \
            --platform terra \
            --image-name "${IMAGE_NAME}" \
            --image-channel "${IMAGE_CHANNEL}" \
            --git-sha "${GIT_SHA}"
