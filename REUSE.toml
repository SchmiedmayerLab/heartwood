version = 1

# Files that cannot carry an inline SPDX header — the root license file,
# generated files, runtime definitions, empty PEP 561 markers, and agent
# Markdown consumed as runtime instructions — are annotated here. All other
# Markdown carries its own SPDX header in an HTML comment.
[[annotations]]
path = [
    "LICENSE",
    ".gitmodules",
    ".jscpd.json",
    ".python-version",
    "uv.lock",
    "agents/**/*.md",
    "images/gpu/vllm-requirements.txt",
    "images/worker/config.json",
    "**/py.typed",
    "**/__pycache__/**",
    "fixtures/**/*.csv",
    "fixtures/**/*.json",
    "fixtures/**/*.jsonl",
    "skills/**/*.json",
    "evals/**/*.json",
    "documentation/**/*.ipynb",
    "packages/persistence/tests/fixtures/**/*.json",
    "packages/gateway/tests/fixtures/**/*.json",
    "packages/compliance/src/heartwood/compliance/benchmarks/data/*.csv",
    "packages/compliance/src/heartwood/compliance/benchmarks/data/*.json",
    "packages/webui/package.json",
    "packages/webui/package-lock.json",
    "packages/webui/tsconfig.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stanford University and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"

# Preserve the imported upstream files byte-for-byte.
[[annotations]]
path = [
    "packages/schemas/src/heartwood/schemas/upstream/mcp-tasks.schema.json",
    "packages/schemas/src/heartwood/schemas/upstream/mcp-tasks.LICENSE.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 The Model Context Protocol Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["images/worker/candidate/sources.json", "images/worker/candidate/gateway.json", "images/worker/candidate/records.json", "images/worker/candidate/build-requirements.txt", "images/worker/candidate/runtime-requirements.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stanford University and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["images/worker/candidate/conversation-admission.patch", "images/worker/candidate/dependency-compatibility.patch"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 OpenHands contributors", "2026 Stanford University and the project authors (see CONTRIBUTORS.md)"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["images/worker/candidate/sandbox-admission.patch", "images/worker/candidate/docker-provisioning.patch", "images/worker/candidate/gateway-delete-retry.patch"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2025-2026 NVIDIA CORPORATION & AFFILIATES", "2026 Stanford University and the project authors (see CONTRIBUTORS.md)"]
SPDX-License-Identifier = "Apache-2.0"
