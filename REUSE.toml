[[annotations]]
path = ["reference-platform/chart/heartwood-platform/Chart.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stanford University and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"
