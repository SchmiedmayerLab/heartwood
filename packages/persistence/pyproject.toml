[project]
name = "heartwood-persistence"
version = "0.3.0-beta.1"
description = "Durable file and schema-migration primitives for Heartwood state."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Stanford University and the project authors" }]
dependencies = ["filelock==3.32.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heartwood"]
