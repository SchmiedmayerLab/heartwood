[project]
name = "heartwood-skills"
version = "0.3.0-beta.4"
description = "Local SKILL.md verification and deterministic skill test harnesses for Heartwood."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Stanford University and the project authors" }]
dependencies = [
    "heartwood-skill-catalog",
    "heartwood-persistence",
    "heartwood-schemas",
    "pydantic",
    "tuf==7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heartwood"]

[tool.uv.sources]
heartwood-skill-catalog = { workspace = true }
heartwood-persistence = { workspace = true }
heartwood-schemas = { workspace = true }
