[project]
name = "heartwood-audit"
version = "0.3.0-beta.3"
description = "Hash-chained audit logging for Heartwood sessions."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Stanford University and the project authors" }]
dependencies = [
    "cryptography==49.0.0",
    "heartwood-persistence",
    "heartwood-schemas",
    "tomli-w==1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heartwood"]

[tool.uv.sources]
heartwood-persistence = { workspace = true }
heartwood-schemas = { workspace = true }
