[project]
name = "heartwood-gateway"
version = "0.4.0"
description = "Session gateway for Heartwood command and event streams."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Stanford University and the project authors" }]
dependencies = [
    "anthropic==0.120.2",
    "certifi==2026.10.23",
    "filelock==3.32.2",
    "heartwood-adapters",
    "heartwood-audit",
    "heartwood-core-adapter",
    "heartwood-model-policy",
    "heartwood-persistence",
    "heartwood-schemas",
    "heartwood-session",
    "heartwood-skills",
    "huggingface-hub==1.26.1",
    "keyring==25.7.0",
    "openhands-sdk==1.60.1",
    "openhands-tools==1.60.1",
    "openai==2.53.0",
    "packaging==26.3",
    "pydantic>=2.12",
    "tomli-w==1.2.0",
    "uv==0.13.7",
    "websockets==16.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heartwood"]

# Keep the runtime catalogs and reviewed resources available in installed wheels.
[tool.hatch.build.targets.wheel.force-include]
"../../images/generic/local-runtime" = "heartwood/gateway/_bundled/images/generic/local-runtime"
"../../agents/verified" = "heartwood/gateway/_bundled/agents/verified"
"../../vendor/heartwood-skills/skills" = "heartwood/gateway/_bundled/vendor/heartwood-skills/skills"

[tool.uv.sources]
heartwood-adapters = { workspace = true }
heartwood-audit = { workspace = true }
heartwood-core-adapter = { workspace = true }
heartwood-model-policy = { workspace = true }
heartwood-persistence = { workspace = true }
heartwood-schemas = { workspace = true }
heartwood-session = { workspace = true }
heartwood-skills = { workspace = true }
