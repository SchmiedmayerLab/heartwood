# Reference platform services. This project is outside the application workspace:
# no application package can depend on it, and its dependencies stay out of the
# application lock. Its only Heartwood dependency is heartwood-schemas.

[project]
name = "heartwood-reference-platform"
version = "0.5.1"
description = "Platform services of the Heartwood Kubernetes reference platform."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Stanford University and the project authors" }]
dependencies = [
    "heartwood-schemas",
    "pydantic>=2.12",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15",
    "starlette>=1.10",
    "uvicorn>=0.54",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heartwood_platform"]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.sources]
heartwood-schemas = { path = "../../packages/schemas", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests", "../tools", "../tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]
# Lets the tests import their helper modules.
pythonpath = ["tests", "../tests/cluster"]
