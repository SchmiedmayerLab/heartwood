# kind's default CNI does not enforce every NetworkPolicy, so the cluster starts without
# one and create-cluster.sh installs Calico. The pod subnet avoids 192.168.0.0/16,
# which overlaps Docker Desktop's DNS address.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
