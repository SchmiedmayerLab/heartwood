# The gateway and staging images below are stand-ins, used when the chart is rendered or
# installed without the built images. An installation with the built images passes the
# gateway image that images/worker/candidate/gateway.json builds with its recorded
# patches as images.openshellGateway, and the worker image by digest in
# sessions.stagingImages.
images:
  # The published OpenShell 0.1.9 gateway.
  openshellGateway: ghcr.io/nvidia/openshell/gateway:0.1.9@sha256:1fd9e1e807990e66c9486a28d3ce9d649fd7528df48d0e830d2de2148b52dfe5

sessions:
  # A small image in place of the worker image.
  stagingImages:
    - registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
  attemptStorageClass:
    provisioner: rancher.io/local-path
