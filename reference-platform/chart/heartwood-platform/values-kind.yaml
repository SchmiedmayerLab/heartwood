# Chart values for the kind cluster that reference-platform/cluster creates.

# The members are the subject identifiers of two synthetic researchers.
projects:
  - id: demo
    billingAttributionRef: synthetic-grant-demo
    policyRef: synthetic-policy-1
    members:
      - 6d1f7c0a-51a4-4d0b-9c1e-0c5a6e2f0001
      - 6d1f7c0a-51a4-4d0b-9c1e-0c5a6e2f0002
    budgets:
      inference: "5"
      compute: "50"
  - id: other
    billingAttributionRef: synthetic-grant-other
    policyRef: synthetic-policy-1
    members:
      - 6d1f7c0a-51a4-4d0b-9c1e-0c5a6e2f0001
    # A session in this project reserves what is left, which ends its key's budget after
    # two requests to the synthetic model.
    budgets:
      inference: "0.006"

researchers:
  - subject: 6d1f7c0a-51a4-4d0b-9c1e-0c5a6e2f0001
    username: researcher-one
  - subject: 6d1f7c0a-51a4-4d0b-9c1e-0c5a6e2f0002
    username: researcher-two

# The gateway and staging images below are stand-ins, used when the chart is rendered or
# installed without the built images. An installation with the built images passes the
# gateway image that images/worker/candidate/gateway.json builds with its recorded
# patches as images.openshellGateway, and the worker image by digest in
# sessions.stagingImages.
images:
  # The published OpenShell 0.1.9 gateway.
  openshellGateway: ghcr.io/nvidia/openshell/gateway:0.1.9@sha256:1fd9e1e807990e66c9486a28d3ce9d649fd7528df48d0e830d2de2148b52dfe5

sessions:
  # A small image in place of the worker image.
  stagingImages:
    - registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
  attemptStorageClass:
    provisioner: rancher.io/local-path

hub:
  # The pod network of the kind cluster.
  trustedProxySources:
    - 10.244.0.0/16
  worker:
    # The staging stand-in above in place of the worker image.
    image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85

# The deterministic synthetic model as the route's only model. One request reports 1000
# input and 500 output tokens.
inference:
  models:
    - name: synthetic-coder
      maxInputTokens: 4096
      maxOutputTokens: 1024
      supportsToolCalls: true
      litellmParams:
        model: openai/synthetic-coder
        api_base: https://synthetic-model.heartwood-platform.svc.cluster.local:8443/v1
      apiKeySecret:
        name: synthetic-model
        key: api-key
  syntheticModel:
    enabled: true

jupyterhub:
  # Short enough for the cluster tests to observe a cull.
  cull:
    timeout: 120
    every: 30
