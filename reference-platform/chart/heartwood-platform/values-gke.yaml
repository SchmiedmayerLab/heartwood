# Chart values for the GKE cluster that reference-platform/infrastructure/gke defines.
# They hold the cluster-specific settings; every other value is shared with kind.

# GKE's default Persistent Disk CSI storage class.
storageClassName: standard-rwo

# Placement of GPU pods on the spot NVIDIA L4 node pool, whose nodes carry the taint
# nvidia.com/gpu=present:NoSchedule.
gpu:
  nodeSelector:
    cloud.google.com/gke-accelerator: nvidia-l4
    cloud.google.com/gke-spot: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
