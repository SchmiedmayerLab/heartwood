# Values of the Heartwood reference platform chart.
# Install the release into the namespace heartwood-platform.

# Container images, each pinned by the digest of its multi-platform index.
images:
  postgresql: docker.io/library/postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
  keycloak: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
  versitygw: ghcr.io/versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
  # Image of the platform services, built from reference-platform/services/Dockerfile.
  # It has no default: set it to a reference by digest at installation.
  platformServices: ""
  # Image of the OpenShell gateway of each session, with the Kubernetes driver.
  # It has no default: set it to a reference by digest.
  openshellGateway: ""
  # Repository from which session pods pull the OpenShell supervisor and sandbox runtime
  # images, each under its upstream name and digest, such as a mirror of the release.
  # Empty pulls them from ghcr.io/nvidia/openshell.
  openshellRepository: ""

# StorageClass of the platform's own volumes. Empty selects the cluster default.
storageClassName: ""

# Synthetic projects of the registry. Each project gets an object store bucket and a
# Keycloak client scope project-<id> that the command line client can request.
# members lists the Keycloak subject identifiers of the researchers of a project.
projects: []
#  - id: demo
#    billingAttributionRef: synthetic-grant-demo
#    policyRef: synthetic-policy-1
#    members: []

# Synthetic researcher accounts of the Keycloak realm. subject is the identifier of the
# account and the subject of its tokens. Each account gets a generated password in the
# Secret keycloak-researchers, under its user name.
researchers: []
#  - subject: 6d1f7c0a-51a4-4d0b-9c1e-0c5a6e2f0001
#    username: researcher-one

control:
  # Identifier of this platform in launch contexts.
  platformId: heartwood-reference-platform
  storage: 1Gi
  # Service accounts that may list projects and launch sessions for researchers.
  serviceCallers:
    - system:serviceaccount:heartwood-sessions:hub
  # Redirect URI of the gateway of one researcher and project.
  redirectUriTemplate: "http://proxy-public.heartwood-sessions.svc.cluster.local/user/{subject}/{project}/oauth_callback"

# Synthetic prices of the control service's estimates, for development and tests.
# They are not the prices of any provider.
# skuPrices are rows of the FOCUS SKU Price dataset, with its column names. Every
# price uses one PricingCurrency, and SkuPriceEligibility must be global.
# runtimeProfiles name the runtime profiles of workload predictions, the kind of work
# each runs, and one rate for each measure of that kind: duration for exploration,
# task_duration for batch, input_tokens and output_tokens for inference. A rate's
# quantityPerPricingUnit is the number of seconds or tokens in one PricingUnit.
syntheticPrices:
  estimateValiditySeconds: 3600
  skuPrices:
    - ServiceProviderName: Synthetic Provider
      SkuId: synthetic-exploration-small
      SkuPriceId: synthetic-exploration-small-list
      ChargeCategory: Usage
      UnitPrice: "0.0005"
      UnitPriceType: List
      PricingUnit: Seconds
      PricingCurrency: USD
      PricingCurrencyCategory: Payable
      SkuPriceEffectiveStart: "2026-01-01T00:00:00Z"
      SkuPriceEligibility:
        IsGlobalScope: true
    - ServiceProviderName: Synthetic Provider
      SkuId: synthetic-batch-small
      SkuPriceId: synthetic-batch-small-list
      ChargeCategory: Usage
      UnitPrice: "0.0003"
      UnitPriceType: List
      PricingUnit: Task-Seconds
      PricingCurrency: USD
      PricingCurrencyCategory: Payable
      SkuPriceEffectiveStart: "2026-01-01T00:00:00Z"
      SkuPriceEligibility:
        IsGlobalScope: true
    - ServiceProviderName: Synthetic Provider
      SkuId: synthetic-batch-gpu
      SkuPriceId: synthetic-batch-gpu-list
      ChargeCategory: Usage
      UnitPrice: "0.004"
      UnitPriceType: List
      PricingUnit: Task-Seconds
      PricingCurrency: USD
      PricingCurrencyCategory: Payable
      SkuPriceEffectiveStart: "2026-01-01T00:00:00Z"
      SkuPriceEligibility:
        IsGlobalScope: true
    - ServiceProviderName: Synthetic Provider
      SkuId: synthetic-coder-input
      SkuPriceId: synthetic-coder-input-list
      ChargeCategory: Usage
      UnitPrice: "0.50"
      UnitPriceType: List
      PricingUnit: 1,000,000 Input Tokens
      PricingCurrency: USD
      PricingCurrencyCategory: Payable
      SkuPriceEffectiveStart: "2026-01-01T00:00:00Z"
      SkuPriceEligibility:
        IsGlobalScope: true
    - ServiceProviderName: Synthetic Provider
      SkuId: synthetic-coder-output
      SkuPriceId: synthetic-coder-output-list
      ChargeCategory: Usage
      UnitPrice: "1.50"
      UnitPriceType: List
      PricingUnit: 1,000,000 Output Tokens
      PricingCurrency: USD
      PricingCurrencyCategory: Payable
      SkuPriceEffectiveStart: "2026-01-01T00:00:00Z"
      SkuPriceEligibility:
        IsGlobalScope: true
  runtimeProfiles:
    - runtimeProfileRef: synthetic-exploration-small
      kind: exploration
      rates:
        - measure: duration
          skuPriceId: synthetic-exploration-small-list
          quantityPerPricingUnit: "1"
    - runtimeProfileRef: synthetic-batch-small
      kind: batch
      rates:
        - measure: task_duration
          skuPriceId: synthetic-batch-small-list
          quantityPerPricingUnit: "1"
    - runtimeProfileRef: synthetic-batch-gpu
      kind: batch
      rates:
        - measure: task_duration
          skuPriceId: synthetic-batch-gpu-list
          quantityPerPricingUnit: "1"
    # The runtime profile of inference is the model name.
    - runtimeProfileRef: synthetic-coder
      kind: inference
      rates:
        - measure: input_tokens
          skuPriceId: synthetic-coder-input-list
          quantityPerPricingUnit: "1000000"
        - measure: output_tokens
          skuPriceId: synthetic-coder-output-list
          quantityPerPricingUnit: "1000000"

postgresql:
  storage: 2Gi

keycloak:
  # Public HTTPS URL of Keycloak and the base of every token issuer.
  # Empty selects the in-cluster Service URL, served with the certificate of the platform CA.
  url: ""

versitygw:
  storage: 5Gi

sessions:
  # Namespace of the Hub and the Heartwood gateway pods.
  namespace: heartwood-sessions
  # Images of the staging pods that a Heartwood gateway may create, by digest: the
  # worker images of the sessions' deployment manifests. During a change of the worker
  # image, list the current and the next image. An empty list denies every pod.
  stagingImages: []
  # Addresses under which pods reach the Kubernetes API server, as a list of
  # {cidr, port}. Session namespaces deny egress by default, and the OpenShell gateway
  # may reach these. Empty reads the addresses from the cluster at installation.
  apiServer: []
  # ResourceQuota of one session namespace.
  quota:
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "20"
    requests.storage: 40Gi
  # Limits and requests of containers that declare none, such as the OpenShell
  # gateway and supervisors. The quota admits only pods with limits.
  containerDefaults:
    cpu: 500m
    memory: 512Mi
  containerDefaultRequests:
    cpu: 100m
    memory: 128Mi
  # StorageClass of the attempt volumes that a Heartwood gateway may create.
  attemptStorageClass:
    provisioner: ""
    parameters: {}

# Placement of GPU pods. Set per cluster.
gpu:
  nodeSelector: {}
  tolerations: []
