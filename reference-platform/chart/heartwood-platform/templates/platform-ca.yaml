{{- /*
The platform certificate authority. Helm creates the key and the certificate at the
first installation, and an existing Secret keeps them. The certificate carries the CA
basic constraint, the certificate signing key usage and a subject key identifier.
*/ -}}
{{- $certificate := "" -}}
{{- $key := "" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "platform-ca" -}}
{{- if $existing -}}
{{- $certificate = index $existing.data "tls.crt" | b64dec -}}
{{- $key = index $existing.data "tls.key" | b64dec -}}
{{- else -}}
{{- $ca := genCA "Heartwood Platform CA" 3650 -}}
{{- $certificate = $ca.Cert -}}
{{- $key = $ca.Key -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: platform-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $certificate | b64enc }}
  tls.key: {{ $key | b64enc }}
---
# The certificate without the key, for components that verify platform certificates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- $certificate | nindent 4 }}
{{- /*
The serving certificates of the platform services that clients reach over TLS, signed
by the platform CA for the names of each Service. An existing certificate is kept
while the CA is kept. The Hub's certificate also names localhost, under which the idle
culler in the Hub's pod reaches it.
*/ -}}
{{- $authority := buildCustomCert ($certificate | b64enc) ($key | b64enc) -}}
{{- $services := list "keycloak" "heartwood-control" "heartwood-data" "versitygw" "litellm" "heartwood-jobs" "hub" -}}
{{- if .Values.inference.syntheticModel.enabled -}}
{{- $services = append $services "synthetic-model" -}}
{{- end -}}
{{- if .Values.inference.localModel.enabled -}}
{{- $services = append $services "llama-server" -}}
{{- end -}}
{{- range $service := $services }}
{{- $secret := printf "%s-tls" $service -}}
{{- $servingCertificate := "" -}}
{{- $servingKey := "" -}}
{{- $servingExisting := lookup "v1" "Secret" $.Release.Namespace $secret -}}
{{- if and $existing $servingExisting -}}
{{- $servingCertificate = index $servingExisting.data "tls.crt" | b64dec -}}
{{- $servingKey = index $servingExisting.data "tls.key" | b64dec -}}
{{- else -}}
{{- $qualified := printf "%s.%s" $service $.Release.Namespace -}}
{{- $names := list $service $qualified (printf "%s.svc" $qualified) (printf "%s.svc.cluster.local" $qualified) -}}
{{- if eq $service "hub" -}}
{{- $names = append $names "localhost" -}}
{{- end -}}
{{- $serving := genSignedCert $service nil $names 825 $authority -}}
{{- $servingCertificate = $serving.Cert -}}
{{- $servingKey = $serving.Key -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "heartwood.labels" $ | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $servingCertificate | b64enc }}
  tls.key: {{ $servingKey | b64enc }}
{{- end }}
{{- /*
The serving certificate of each project's Funnel server, for the names of its Service, and
the CA certificate for the workers that verify it, in the project's jobs namespace.
*/ -}}
{{- range $project := .Values.projects }}
{{- $namespace := printf "hw-jobs-%s" $project.id -}}
{{- $servingCertificate := "" -}}
{{- $servingKey := "" -}}
{{- $servingExisting := lookup "v1" "Secret" $namespace "funnel-server-tls" -}}
{{- if and $existing $servingExisting -}}
{{- $servingCertificate = index $servingExisting.data "tls.crt" | b64dec -}}
{{- $servingKey = index $servingExisting.data "tls.key" | b64dec -}}
{{- else -}}
{{- $qualified := printf "funnel-server.%s" $namespace -}}
{{- $names := list $qualified (printf "%s.svc" $qualified) (printf "%s.svc.cluster.local" $qualified) -}}
{{- $serving := genSignedCert $qualified nil $names 825 $authority -}}
{{- $servingCertificate = $serving.Cert -}}
{{- $servingKey = $serving.Key -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: funnel-server-tls
  namespace: {{ $namespace }}
  labels:
    {{- include "heartwood.labels" $ | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $servingCertificate | b64enc }}
  tls.key: {{ $servingKey | b64enc }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-ca
  namespace: {{ $namespace }}
  labels:
    {{- include "heartwood.labels" $ | nindent 4 }}
data:
  ca.crt: |
    {{- $certificate | nindent 4 }}
{{- end }}
{{- /*
The CA certificate for the Mountpoint pods of dataset volumes, in the namespace where the
Mountpoint S3 CSI driver creates them. The policy heartwood-dataset-reader-ca mounts it
as their trust bundle.
*/ -}}
{{- $mounts := false -}}
{{- range .Values.projects }}{{- if .interactiveDataset }}{{- $mounts = true }}{{- end }}{{- end -}}
{{- if $mounts }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-ca
  namespace: mount-s3
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- $certificate | nindent 4 }}
{{- end }}
{{- /*
The serving certificate of the Hub's proxy, for the names of its public and API Services
and the host of hub.publicOrigin, which the proxy also presents as its client certificate
to the Hub. The names are recorded on the Secret, and an existing
certificate is kept while the CA and the names are kept.
*/ -}}
{{- $proxyNames := list -}}
{{- range $service := list "proxy-public" "proxy-api" -}}
{{- $qualified := printf "%s.%s" $service $.Release.Namespace -}}
{{- $proxyNames = concat $proxyNames (list $service $qualified (printf "%s.svc" $qualified) (printf "%s.svc.cluster.local" $qualified)) -}}
{{- end -}}
{{- $hubHost := (urlParse .Values.hub.publicOrigin).hostname -}}
{{- $proxyNames = append $proxyNames $hubHost | uniq -}}
{{- if or (eq $hubHost .Values.hub.projectDomain) (hasSuffix (printf ".%s" $hubHost) .Values.hub.projectDomain) (hasSuffix (printf ".%s" .Values.hub.projectDomain) $hubHost) -}}
{{- fail "hub.projectDomain and the Hub host must be separate DNS domains" -}}
{{- end -}}
{{- range .Values.projects -}}
{{- $proxyNames = append $proxyNames (printf "*.%s.%s" .id $.Values.hub.projectDomain) -}}
{{- end -}}
{{- $proxyNamesText := join "," $proxyNames -}}
{{- $proxyCertificate := "" -}}
{{- $proxyKey := "" -}}
{{- $proxyExisting := lookup "v1" "Secret" .Release.Namespace "proxy-tls" -}}
{{- if and $existing $proxyExisting (eq (dig "metadata" "annotations" "heartwood.platform/names" "" $proxyExisting) $proxyNamesText) -}}
{{- $proxyCertificate = index $proxyExisting.data "tls.crt" | b64dec -}}
{{- $proxyKey = index $proxyExisting.data "tls.key" | b64dec -}}
{{- else -}}
{{- $proxyServing := genSignedCert "proxy-public" nil $proxyNames 825 $authority -}}
{{- $proxyCertificate = $proxyServing.Cert -}}
{{- $proxyKey = $proxyServing.Key -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: proxy-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
  annotations:
    heartwood.platform/names: {{ $proxyNamesText | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $proxyCertificate | b64enc }}
  tls.key: {{ $proxyKey | b64enc }}
  # The proxy verifies the Hub and the gateways against the platform CA alone.
  ca.crt: {{ $certificate | b64enc }}
