{{- /*
The platform certificate authority. Helm creates the key and the certificate at the
first installation, and an existing Secret keeps them. The certificate carries the CA
basic constraint, the certificate signing key usage and a subject key identifier.
*/ -}}
{{- $certificate := "" -}}
{{- $key := "" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "platform-ca" -}}
{{- if $existing -}}
{{- $certificate = index $existing.data "tls.crt" | b64dec -}}
{{- $key = index $existing.data "tls.key" | b64dec -}}
{{- else -}}
{{- $ca := genCA "Heartwood Platform CA" 3650 -}}
{{- $certificate = $ca.Cert -}}
{{- $key = $ca.Key -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: platform-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $certificate | b64enc }}
  tls.key: {{ $key | b64enc }}
---
# The certificate without the key, for components that verify platform certificates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
data:
  ca.crt: |
    {{- $certificate | nindent 4 }}
{{- /*
The serving certificates of the platform services that clients reach over TLS, signed
by the platform CA for the names of each Service. An existing certificate is kept
while the CA is kept.
*/ -}}
{{- $authority := buildCustomCert ($certificate | b64enc) ($key | b64enc) -}}
{{- $services := list "keycloak" "heartwood-control" "heartwood-data" "versitygw" "litellm" -}}
{{- if .Values.inference.syntheticModel.enabled -}}
{{- $services = append $services "synthetic-model" -}}
{{- end -}}
{{- if .Values.inference.localModel.enabled -}}
{{- $services = append $services "llama-server" -}}
{{- end -}}
{{- range $service := $services }}
{{- $secret := printf "%s-tls" $service -}}
{{- $servingCertificate := "" -}}
{{- $servingKey := "" -}}
{{- $servingExisting := lookup "v1" "Secret" $.Release.Namespace $secret -}}
{{- if and $existing $servingExisting -}}
{{- $servingCertificate = index $servingExisting.data "tls.crt" | b64dec -}}
{{- $servingKey = index $servingExisting.data "tls.key" | b64dec -}}
{{- else -}}
{{- $qualified := printf "%s.%s" $service $.Release.Namespace -}}
{{- $names := list $service $qualified (printf "%s.svc" $qualified) (printf "%s.svc.cluster.local" $qualified) -}}
{{- $serving := genSignedCert $service nil $names 825 $authority -}}
{{- $servingCertificate = $serving.Cert -}}
{{- $servingKey = $serving.Key -}}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "heartwood.labels" $ | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $servingCertificate | b64enc }}
  tls.key: {{ $servingKey | b64enc }}
{{- end }}
