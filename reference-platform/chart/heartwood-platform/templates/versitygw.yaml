apiVersion: v1
kind: Secret
metadata:
  name: versitygw-root
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
type: Opaque
data:
  access-key: {{ "heartwood-root" | b64enc }}
  secret-key: {{ include "heartwood.credential" (dict "context" . "name" "versitygw-root" "key" "secret-key") }}
---
apiVersion: v1
kind: Service
metadata:
  name: versitygw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "heartwood.selector" (dict "context" . "component" "versitygw") | nindent 4 }}
  ports:
    - name: s3
      port: 7070
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: versitygw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  serviceName: versitygw
  replicas: 1
  selector:
    matchLabels:
      {{- include "heartwood.selector" (dict "context" . "component" "versitygw") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heartwood.selector" (dict "context" . "component" "versitygw") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "heartwood.podSecurityContext" 65532 | nindent 8 }}
      containers:
        - name: versitygw
          image: {{ .Values.images.versitygw }}
          # The store serves only HTTPS, with its certificate from the platform CA.
          args:
            - --cert
            - /etc/versitygw/tls/tls.crt
            - --key
            - /etc/versitygw/tls/tls.key
            - --health
            - /health
            - --iam-dir
            - /data/iam
            - posix
            - /data/buckets
          securityContext:
            {{- include "heartwood.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-root
                  key: access-key
            - name: ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-root
                  key: secret-key
          ports:
            - name: s3
              containerPort: 7070
          readinessProbe:
            httpGet:
              path: /health
              port: s3
              scheme: HTTPS
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /etc/versitygw/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: versitygw-tls
      initContainers:
        - name: directories
          image: {{ .Values.images.versitygw }}
          command: [mkdir, -p, /data/iam, /data/buckets]
          securityContext:
            {{- include "heartwood.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "heartwood.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.versitygw.storage }}
{{- if .Values.projects }}
---
# Creates one bucket for each project. An existing bucket is left unchanged.
apiVersion: batch/v1
kind: Job
metadata:
  name: versitygw-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "heartwood.selector" (dict "context" . "component" "versitygw-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "heartwood.podSecurityContext" 65532 | nindent 8 }}
      containers:
        - name: create-buckets
          image: {{ .Values.images.versitygw }}
          securityContext:
            {{- include "heartwood.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              for bucket in "$@"; do
                if versitygw admin list-buckets | grep -q "^${bucket} "; then
                  echo "Bucket ${bucket} exists."
                else
                  versitygw admin create-bucket --owner "${ADMIN_ACCESS_KEY}" --bucket "${bucket}"
                fi
              done
            - create-buckets
            {{- range .Values.projects }}
            - hw-project-{{ .id }}
            {{- end }}
          env:
            - name: ADMIN_ENDPOINT_URL
              value: https://versitygw:7070
            # The admin client verifies the store against the platform CA alone.
            - name: SSL_CERT_FILE
              value: /etc/versitygw/ca/ca.crt
            - name: ADMIN_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-root
                  key: access-key
            - name: ADMIN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: versitygw-root
                  key: secret-key
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: platform-ca
              mountPath: /etc/versitygw/ca
              readOnly: true
      volumes:
        - name: platform-ca
          configMap:
            name: platform-ca
            items:
              - key: ca.crt
                path: ca.crt
{{- end }}
