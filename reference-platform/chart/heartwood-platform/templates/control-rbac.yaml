apiVersion: v1
kind: ServiceAccount
metadata:
  name: heartwood-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# The identity of platform operators at the control service, which accepts its tokens for
# the rotation of project client secrets. It has no Kubernetes rights.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: heartwood-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
# Cluster rights of the control service. The admission policy heartwood-control-scope
# confines them to session namespaces and to the fixed role and subject pairs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: heartwood-control
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, delete]
  # The kube-system UID identifies the cluster in the launch context.
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames:
      - heartwood-openshell-sandbox
      - heartwood-openshell-peer
      - heartwood-openshell-certgen
      - heartwood-openshell-node-reader
      - heartwood-session-gateway
      - heartwood-session-control
    verbs: [bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    resourceNames: [heartwood-openshell-node-reader]
    verbs: [update, patch]
  # Verifies the service account tokens of calling platform services.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: heartwood-control
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: heartwood-control
subjects:
  - kind: ServiceAccount
    name: heartwood-control
    namespace: {{ .Release.Namespace }}
---
# The control service creates the ServiceAccount and the configuration Secret of each
# Heartwood gateway.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heartwood-control
  namespace: {{ .Values.sessions.namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts, secrets]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heartwood-control
  namespace: {{ .Values.sessions.namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heartwood-control
subjects:
  - kind: ServiceAccount
    name: heartwood-control
    namespace: {{ .Release.Namespace }}
