{{- if eq .Values.jobs.executor "funnel" }}
{{- /*
A Funnel worker may create only executor Jobs of its own task, in the shape that the
executor template renders. The worker's identity is the ServiceAccount funnel-worker of
its jobs namespace, and its token is bound to its pod, whose name is the task's worker Job
name, the task identifier, with a suffix. A Job of another task, or one that mounts any
claim other than the task's workspace claim, is refused. Pod Security restricted covers
host namespaces, capabilities and privilege escalation. The only scheduling choice is the
toleration of the GPU nodes' taint nvidia.com/gpu=present:NoSchedule, for a Job whose
container requests GPUs in the namespace of a project with the GPU entitlement.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: heartwood-funnel-worker-jobs
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs]
  matchConditions:
    - name: created-by-a-funnel-worker
      expression: >-
        request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':funnel-worker'
  variables:
    - name: pod
      expression: object.spec.template.spec
    - name: labels
      expression: "has(object.spec.template.metadata.labels) ? object.spec.template.metadata.labels : {}"
    - name: task
      expression: >-
        'heartwood.platform/task' in variables.labels
        ? string(variables.labels['heartwood.platform/task']) : ''
    # The labels of the Job itself.
    - name: jobLabels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    # The name of the pod that the worker's token is bound to.
    - name: workerPod
      expression: >-
        'authentication.kubernetes.io/pod-name' in request.userInfo.extra &&
        size(request.userInfo.extra['authentication.kubernetes.io/pod-name']) == 1
        ? string(request.userInfo.extra['authentication.kubernetes.io/pod-name'][0]) : ''
    - name: tolerations
      expression: "has(object.spec.template.spec.tolerations) ? object.spec.template.spec.tolerations : []"
    # The chart labels the jobs namespace of a project with the GPU entitlement.
    - name: gpuEntitled
      expression: >-
        has(namespaceObject.metadata.labels)
        && 'heartwood.platform/gpu' in namespaceObject.metadata.labels
        && namespaceObject.metadata.labels['heartwood.platform/gpu'] == 'true'
    # Every container of the Job requests at least one GPU.
    - name: gpuTask
      expression: >-
        variables.pod.containers.all(c, has(c.resources) && has(c.resources.limits)
        && 'nvidia.com/gpu' in c.resources.limits
        && quantity(string(c.resources.limits['nvidia.com/gpu'])).isGreaterThan(quantity('0')))
  validations:
    - expression: request.operation == 'CREATE'
      message: workers may not change Jobs
    - expression: variables.task.matches('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      message: worker-created Jobs must name their task
    - expression: variables.workerPod.matches('^' + variables.task + '-[a-z0-9]{5}$')
      message: worker-created Jobs must belong to the task of the worker's pod
    - expression: object.metadata.name.matches('^' + variables.task + '-[0-9]+$')
      message: worker-created Jobs must be named after their task
    # Funnel finds executor Jobs by the label app, and the API server adds the Job's
    # selector labels to the pod template before admission.
    # Each label is compared on its own, so every comparison is between strings.
    - expression: >-
        size(variables.jobLabels) == 3
        && 'app' in variables.jobLabels && variables.jobLabels['app'] == 'funnel-executor'
        && 'heartwood.platform/role' in variables.jobLabels
        && variables.jobLabels['heartwood.platform/role'] == 'funnel-executor'
        && 'heartwood.platform/task' in variables.jobLabels
        && variables.jobLabels['heartwood.platform/task'] == variables.task
        && 'app' in variables.labels && variables.labels['app'] == 'funnel-executor'
        && 'heartwood.platform/role' in variables.labels
        && variables.labels['heartwood.platform/role'] == 'funnel-executor'
        && variables.labels.all(k, k in ['app', 'heartwood.platform/role', 'heartwood.platform/task',
        'job-name', 'controller-uid', 'batch.kubernetes.io/job-name', 'batch.kubernetes.io/controller-uid'])
      message: worker-created Jobs must carry exactly the executor labels of their task
    - expression: "!has(object.spec.manualSelector) || object.spec.manualSelector == false"
      message: worker-created Jobs must not choose their selector
    # The API server sets these defaults before admission.
    - expression: >-
        object.spec.parallelism == 1 && object.spec.completions == 1 && object.spec.backoffLimit == 0
        && (!has(object.spec.completionMode) || object.spec.completionMode == 'NonIndexed')
        && (!has(object.spec.suspend) || object.spec.suspend == false)
        && !has(object.spec.podFailurePolicy) && variables.pod.restartPolicy == 'Never'
        && variables.pod.containers.all(c, !has(c.restartPolicy) && !has(c.restartPolicyRules))
      message: worker-created Jobs run one pod once
    - expression: has(variables.pod.serviceAccountName) && variables.pod.serviceAccountName == 'funnel-executor'
      message: worker-created Jobs must run as funnel-executor
    - expression: has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false
      message: worker-created Jobs must not mount a ServiceAccount token
    - expression: has(variables.pod.hostUsers) && variables.pod.hostUsers == false
      message: worker-created Jobs must use a user namespace
    - expression: >-
        !has(variables.pod.volumes) || variables.pod.volumes.all(v,
        has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == variables.task + '-workspace')
      message: worker-created Jobs may mount only their task's workspace claim
    - expression: >-
        !has(variables.pod.initContainers) && !has(variables.pod.ephemeralContainers)
        && !has(variables.pod.imagePullSecrets) && size(variables.pod.containers) == 1
      message: worker-created Jobs have one container and no init or ephemeral containers or pull secrets
    - expression: "variables.pod.containers.all(c, !has(c.envFrom) && (!has(c.env) || c.env.all(e, !has(e.valueFrom))))"
      message: worker-created Jobs must not reference Secrets or ConfigMaps in their environment
    # The API server sets the default scheduler before admission; an empty node selector
    # chooses nothing.
    - expression: >-
        !has(variables.pod.nodeName)
        && (!has(variables.pod.nodeSelector) || size(variables.pod.nodeSelector) == 0)
        && !has(variables.pod.affinity)
        && !has(variables.pod.priorityClassName) && !has(variables.pod.runtimeClassName)
        && !has(variables.pod.schedulingGates) && !has(variables.pod.topologySpreadConstraints)
        && (!has(variables.pod.schedulerName) || variables.pod.schedulerName == 'default-scheduler')
        && !has(variables.pod.resourceClaims) && !has(variables.pod.hostname) && !has(variables.pod.subdomain)
      message: worker-created Jobs must not choose their node, scheduling, runtime or host name
    # Exactly the toleration of the GPU taint, with operator Exists, or Equal and its value.
    - expression: >-
        size(variables.tolerations) == 0
        || (size(variables.tolerations) == 1 && variables.tolerations.all(t,
        has(t.key) && t.key == 'nvidia.com/gpu' && has(t.effect) && t.effect == 'NoSchedule'
        && !has(t.tolerationSeconds)
        && ((has(t.operator) && t.operator == 'Exists' && (!has(t.value) || t.value == ''))
        || ((!has(t.operator) || t.operator == 'Equal') && has(t.value) && t.value == 'present'))))
      message: worker-created Jobs may tolerate only the GPU taint nvidia.com/gpu=present:NoSchedule
    - expression: size(variables.tolerations) == 0 || (variables.gpuEntitled && variables.gpuTask)
      message: only GPU tasks of a project with the GPU entitlement may tolerate the GPU taint
    - expression: >-
        variables.pod.containers.all(c, !has(c.securityContext) || !has(c.securityContext.procMount)
        || c.securityContext.procMount == 'Default')
      message: worker-created Jobs must use the default proc mount
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: heartwood-funnel-worker-jobs
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  policyName: heartwood-funnel-worker-jobs
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        heartwood.platform/jobs: "true"
{{- end }}
