{{- /*
The label heartwood.platform/role=project-data-copy admits a pod of a session namespace to
the object store. Only the copy Jobs of the control service carry it: the control service
creates them, and the Job controller creates their pods, as the ServiceAccount
kube-system:job-controller, which controller managers that use separate service account
credentials for each controller, such as kubeadm's and kind's, do. An update changes
neither the specification nor the labels of such a pod.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: heartwood-project-data-copy
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: heartwood.platform/session
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [batch]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [jobs]
  variables:
    - name: role
      expression: "'heartwood.platform/role'"
    - name: copy
      expression: >-
        has(object.metadata.labels) && variables.role in object.metadata.labels
        && object.metadata.labels[variables.role] == 'project-data-copy'
    - name: copied
      expression: >-
        oldObject != null && has(oldObject.metadata.labels) && variables.role in oldObject.metadata.labels
        && oldObject.metadata.labels[variables.role] == 'project-data-copy'
    - name: templateCopy
      expression: >-
        request.resource.resource == 'jobs' && has(object.spec.template.metadata)
        && has(object.spec.template.metadata.labels) && variables.role in object.spec.template.metadata.labels
        && object.spec.template.metadata.labels[variables.role] == 'project-data-copy'
  validations:
    - expression: >-
        request.resource.resource != 'pods' || !variables.copy
        || (request.operation == 'UPDATE' && variables.copied
        && object.spec == oldObject.spec && object.metadata.labels == oldObject.metadata.labels)
        || (request.operation == 'CREATE'
        && request.userInfo.username == 'system:serviceaccount:kube-system:job-controller'
        && has(object.metadata.ownerReferences) && object.metadata.ownerReferences.size() == 1
        && object.metadata.ownerReferences[0].kind == 'Job'
        && object.metadata.ownerReferences[0].name.startsWith('hw-project-data-copy-'))
      message: only the pods of the control service's copy Jobs carry the project data copy label
    - expression: >-
        request.resource.resource != 'jobs' || !(variables.copy || variables.templateCopy)
        || (request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:heartwood-control'
        && object.metadata.name.startsWith('hw-project-data-copy-'))
      message: only the control service creates Jobs that carry the project data copy label
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: heartwood-project-data-copy
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  policyName: heartwood-project-data-copy
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: heartwood-mounted-dataset-claims
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: [persistentvolumeclaims]
        operations: [CREATE]
  validations:
    - expression: >-
        !(object.metadata.name == 'hw-mounted-data' ||
        (has(object.spec.volumeName) && object.spec.volumeName.matches('^hw-s-[a-f0-9]{16}-dataset$')))
        || (request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:heartwood-control'
        && request.namespace.matches('^hw-s-[a-f0-9]{16}$')
        && object.metadata.name == 'hw-mounted-data' && object.spec.volumeName == request.namespace + '-dataset'
        && object.spec.accessModes == ['ReadOnlyMany'] && object.spec.storageClassName == '')
      message: the control service reserves mounted dataset claims in their session namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: heartwood-mounted-dataset-claims
spec:
  policyName: heartwood-mounted-dataset-claims
  validationActions: [Deny]
