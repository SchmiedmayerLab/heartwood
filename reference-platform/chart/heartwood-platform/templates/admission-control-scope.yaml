{{- /*
Confines every write of the control service. RBAC cannot name the session namespaces,
which are created at run time, so this policy does.
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: heartwood-control-scope
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["*"]
        resources: ["*/*"]
  matchConditions:
    - name: control-service
      expression: request.userInfo.username == 'system:serviceaccount:{{ .Release.Namespace }}:heartwood-control'
  variables:
    - name: resource
      expression: request.resource.resource
    # The API server omits empty request fields.
    - name: requestNamespace
      expression: "has(request.namespace) ? request.namespace : ''"
    - name: requestName
      expression: "has(request.name) ? request.name : ''"
    - name: requestSubResource
      expression: "has(request.subResource) ? request.subResource : ''"
    - name: sessionNamespace
      expression: variables.requestNamespace.matches('^hw-s-[a-z0-9]{1,40}$')
    # DELETE requests carry the object in oldObject.
    - name: target
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: subject
      expression: >-
        variables.resource == 'rolebindings' && has(variables.target.subjects)
        && variables.target.subjects.size() == 1 ? variables.target.subjects[0]
        : {'kind': '', 'name': '', 'namespace': ''}
    - name: oldSubjects
      expression: "has(oldObject.subjects) ? oldObject.subjects : []"
    - name: newSubjects
      expression: "has(object.subjects) ? object.subjects : []"
  validations:
    - expression: >-
        (variables.requestNamespace == '' && variables.resource in
        ['namespaces', 'persistentvolumes', 'clusterrolebindings', 'tokenreviews', 'selfsubjectaccessreviews', 'selfsubjectrulesreviews'])
        || (variables.resource == 'namespaces' && variables.requestNamespace == variables.requestName)
        || variables.sessionNamespace
        || (variables.requestNamespace == '{{ .Values.sessions.namespace }}' && variables.resource in ['serviceaccounts', 'secrets'])
      message: the control service writes only in session namespaces and the listed platform objects
    - expression: >-
        variables.resource != 'persistentvolumes' || (request.operation == 'CREATE'
        && object.spec.claimRef.namespace.matches('^hw-s-[a-f0-9]{16}$')
        && object.metadata.name == object.spec.claimRef.namespace + '-dataset'
        && object.spec.claimRef.name == 'hw-mounted-data' && object.spec.claimRef.uid != ''
        && object.metadata.ownerReferences.size() == 1
        && object.metadata.ownerReferences[0].apiVersion == 'v1'
        && object.metadata.ownerReferences[0].kind == 'Namespace'
        && object.metadata.ownerReferences[0].name == object.spec.claimRef.namespace
        && object.spec.accessModes == ['ReadOnlyMany']
        && (!has(object.spec.storageClassName) || object.spec.storageClassName == '')
        && object.spec.persistentVolumeReclaimPolicy == 'Retain'
        && object.spec.csi.driver == 's3.csi.aws.com' && object.spec.csi.readOnly
        && object.spec.csi.volumeHandle == object.metadata.name
        && !has(object.spec.csi.controllerPublishSecretRef) && !has(object.spec.csi.nodeStageSecretRef)
        && !has(object.spec.csi.nodePublishSecretRef) && !has(object.spec.csi.controllerExpandSecretRef)
        && !has(object.spec.csi.nodeExpandSecretRef)
        && (false
        {{- range .Values.projects }}
        {{- if .interactiveDataset }}
        || (object.metadata.labels['heartwood.platform/project'] == '{{ .id }}'
        && object.spec.csi.volumeAttributes == {'bucketName': 'hw-project-{{ .id }}', 'authenticationSource': 'driver'}
        && object.spec.mountOptions == ['read-only', 'allow-other', 'region us-east-1', 'force-path-style',
        'endpoint-url https://versitygw.{{ $.Release.Namespace }}.svc.cluster.local:7070',
        'prefix datasets/{{ .interactiveDataset.id }}/{{ .interactiveDataset.version }}/'])
        {{- end }}
        {{- end }}
        ))
      message: the control service reserves only read-only volumes of configured dataset versions for session claims
    - expression: >-
        variables.resource != 'namespaces'
        || (variables.requestSubResource == '' && request.operation in ['CREATE', 'DELETE']
        && variables.target.metadata.name.matches('^hw-s-[a-z0-9]{1,40}$'))
      message: the control service creates and deletes only namespaces named hw-s-<session>
    - expression: >-
        variables.resource != 'namespaces' || request.operation != 'CREATE'
        || (has(object.metadata.labels)
        && 'pod-security.kubernetes.io/enforce' in object.metadata.labels
        && object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted'
        && (!('pod-security.kubernetes.io/enforce-version' in object.metadata.labels)
        || object.metadata.labels['pod-security.kubernetes.io/enforce-version'] == 'latest')
        && 'heartwood.platform/session' in object.metadata.labels
        && 'hw-s-' + object.metadata.labels['heartwood.platform/session'] == object.metadata.name
        && !('heartwood.platform/jobs' in object.metadata.labels))
      message: a session namespace carries its session label and the restricted Pod Security label, and no jobs label
    - expression: >-
        variables.resource != 'rolebindings'
        || (request.operation in ['CREATE', 'DELETE'] && variables.sessionNamespace
        && variables.target.roleRef.apiGroup == 'rbac.authorization.k8s.io'
        && variables.target.roleRef.kind == 'ClusterRole'
        && variables.subject.kind == 'ServiceAccount'
        && ((variables.target.roleRef.name in ['heartwood-openshell-sandbox', 'heartwood-openshell-peer']
        && variables.subject.name == 'openshell' && variables.subject.namespace == variables.requestNamespace)
        || (variables.target.roleRef.name == 'heartwood-openshell-certgen'
        && variables.subject.name == 'openshell-certgen' && variables.subject.namespace == variables.requestNamespace)
        || (variables.target.roleRef.name == 'heartwood-session-gateway'
        && variables.subject.name.startsWith('hw-gw-')
        && 'hw-s-' + variables.subject.name.substring(6) == variables.requestNamespace
        && variables.subject.namespace == '{{ .Values.sessions.namespace }}')
        || (variables.target.roleRef.name == 'heartwood-session-control'
        && variables.subject.name == 'heartwood-control'
        && variables.subject.namespace == '{{ .Release.Namespace }}')))
      message: a RoleBinding of the control service pairs a fixed ClusterRole with its only allowed subject inside a session namespace
    - expression: >-
        variables.resource != 'clusterrolebindings'
        || (request.operation == 'UPDATE' && variables.requestName == 'heartwood-openshell-node-reader'
        && object.roleRef == oldObject.roleRef
        && object.metadata.?labels == oldObject.metadata.?labels
        && object.metadata.?annotations == oldObject.metadata.?annotations
        && object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences
        && object.metadata.?finalizers == oldObject.metadata.?finalizers
        && (variables.newSubjects.filter(s, !(s in variables.oldSubjects))
        + variables.oldSubjects.filter(s, !(s in variables.newSubjects))).all(s,
        s.kind == 'ServiceAccount' && s.name == 'openshell'
        && has(s.namespace) && s.namespace.matches('^hw-s-[a-z0-9]{1,40}$')))
      message: the control service adds and removes only the OpenShell ServiceAccounts of session namespaces in heartwood-openshell-node-reader
    - expression: >-
        variables.requestNamespace != '{{ .Values.sessions.namespace }}'
        || variables.requestName.startsWith('hw-gw-')
        || (request.operation == 'CREATE' && object.metadata.name.startsWith('hw-gw-'))
      message: the control service writes only objects named hw-gw-<session> in {{ .Values.sessions.namespace }}
    # The token controller fills a Secret of the service account token type with a token.
    - expression: >-
        variables.resource != 'secrets' || request.operation == 'DELETE'
        || !has(object.type) || object.type == 'Opaque'
      message: the control service writes only Secrets of the type Opaque
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: heartwood-control-scope
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  policyName: heartwood-control-scope
  validationActions: [Deny]
