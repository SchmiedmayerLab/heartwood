{{- $gatewayImage := required "images.hostedGateway must name the hosted gateway image by digest" .Values.images.hostedGateway -}}
{{- $sessions := .Values.sessions.namespace -}}
{{- $context := dict "capabilities" (dict "drop" (list "ALL")) "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "runAsNonRoot" true "runAsUser" 10001 "runAsGroup" 10001 "seccompProfile" (dict "type" "RuntimeDefault") -}}
{{- $resources := dict "cpu_limit" .Values.hub.resources.cpuLimit "cpu_guarantee" .Values.hub.resources.cpuGuarantee "memory_limit" .Values.hub.resources.memoryLimit "memory_guarantee" .Values.hub.resources.memoryGuarantee -}}
{{- $initResources := dict "limits" (dict "cpu" "500m" "memory" "256Mi") "requests" (dict "cpu" "50m" "memory" "64Mi") -}}
{{- $mounts := include "heartwood.hubMounts" . | fromJson -}}
{{- $storage := dict "capacity" .Values.hub.storage.capacity "storage_class" .Values.hub.storage.storageClassName -}}
{{- $settings := dict "namespace" $sessions "issuer" (printf "%s/realms/heartwood" (include "heartwood.keycloakUrl" .)) "client_id" "heartwood-hub" "client_secret_file" "/usr/local/etc/heartwood/hub/client/client-secret" "ca_file" "/usr/local/etc/heartwood/platform-ca/ca.crt" "control_url" (printf "https://heartwood-control.%s.svc.cluster.local:8443" .Release.Namespace) "token_file" "/var/run/secrets/heartwood/control/token" "public_origin" .Values.hub.publicOrigin "trusted_proxy_sources" .Values.hub.trustedProxySources "gateway_image" $gatewayImage "container_security_context" $context "resources" $resources "init_resources" $initResources "storage" $storage "volume_mounts" $mounts.main "init_mounts" $mounts.init -}}
# The Hub's configuration file and its settings. It holds no credential.
apiVersion: v1
kind: ConfigMap
metadata:
  name: heartwood-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
data:
  heartwood_hub.py: |
    {{- .Files.Get "files/hub/heartwood_hub.py" | nindent 4 }}
  settings.json: |
    {{- $settings | toPrettyJson | nindent 4 }}
---
# The secret of the Hub's Keycloak client, which the realm import and the Hub read.
apiVersion: v1
kind: Secret
metadata:
  name: heartwood-hub-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
type: Opaque
data:
  client-secret: {{ include "heartwood.credential" (dict "context" . "name" "heartwood-hub-keycloak" "key" "client-secret") }}
---
# What KubeSpawner needs to start and stop gateway pods in the sessions namespace: pods,
# their volume claims and events. No Secrets and no Services: a pod mounts its session's
# Secret, and the admission policy heartwood-hub-pods decides which pods the Hub creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heartwood-hub-spawner
  namespace: {{ $sessions }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete, get]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heartwood-hub-spawner
  namespace: {{ $sessions }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heartwood-hub-spawner
subjects:
  - kind: ServiceAccount
    name: hub
    namespace: {{ .Release.Namespace }}
