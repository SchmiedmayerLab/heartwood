{{- define "heartwood.controlConfiguration" -}}
{{- $projects := list -}}
{{- range .Values.projects -}}
{{- $projects = append $projects (dict "id" .id "billing_attribution_ref" .billingAttributionRef "policy_ref" .policyRef "members" (.members | default list) "budgets" (.budgets | default dict)) -}}
{{- end -}}
{{- $keycloak := dict "url" "https://keycloak:8443" "ca_file" "/etc/heartwood-control/platform-ca/ca.crt" "issuer" (include "heartwood.issuer" .) "realm" "heartwood" "client_id" "heartwood-control" "client_secret_file" "/etc/heartwood-control/keycloak/client-secret" -}}
{{- /* Without configured addresses, the Service address and the endpoints of the API server are read from the cluster. */ -}}
{{- $apiServer := .Values.sessions.apiServer -}}
{{- if not $apiServer -}}
{{- $service := lookup "v1" "Service" "default" "kubernetes" -}}
{{- if $service -}}
{{- $apiServer = append $apiServer (dict "cidr" (include "heartwood.hostCidr" $service.spec.clusterIP) "port" 443) -}}
{{- end -}}
{{- $slice := lookup "discovery.k8s.io/v1" "EndpointSlice" "default" "kubernetes" -}}
{{- if $slice -}}
{{- range $endpoint := $slice.endpoints -}}
{{- range $address := $endpoint.addresses -}}
{{- $apiServer = append $apiServer (dict "cidr" (include "heartwood.hostCidr" $address) "port" (index $slice.ports 0).port) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $apiServer -}}
{{- fail "sessions.apiServer is empty and the API server addresses cannot be read from the cluster" -}}
{{- end -}}
{{- $sessions := dict "control_namespace" .Release.Namespace "control_account" "heartwood-control" "gateway_namespace" .Values.sessions.namespace "openshell_objects_file" "/etc/heartwood-control/openshell/openshell-session.json" "openshell_gateway_image" .Values.images.openshellGateway "openshell_repository" .Values.images.openshellRepository "api_server" $apiServer "quota" .Values.sessions.quota "container_defaults" .Values.sessions.containerDefaults "container_default_requests" .Values.sessions.containerDefaultRequests "platform_ca_file" "/etc/heartwood-control/platform-ca/ca.crt" "actor_key_file" "/etc/heartwood-control/actor-key/actor-key" -}}
{{- $prices := .Values.syntheticPrices -}}
{{- $profiles := list -}}
{{- range $prices.runtimeProfiles -}}
{{- $rates := list -}}
{{- range .rates -}}
{{- $rates = append $rates (dict "measure" .measure "sku_price_id" .skuPriceId "quantity_per_pricing_unit" .quantityPerPricingUnit) -}}
{{- end -}}
{{- $profiles = append $profiles (dict "runtime_profile_ref" .runtimeProfileRef "kind" .kind "rates" $rates) -}}
{{- end -}}
{{- /* The SKU prices keep their FOCUS column names. */ -}}
{{- $syntheticPrices := dict "estimate_validity_seconds" $prices.estimateValiditySeconds "sku_prices" $prices.skuPrices "runtime_profiles" $profiles -}}
{{- $tls := dict "certificate_file" "/etc/heartwood-control/tls/tls.crt" "key_file" "/etc/heartwood-control/tls/tls.key" -}}
{{- $worker := .Values.hub.worker -}}
{{- $route := .Values.hub.modelRoute -}}
{{- if not $route.binaries -}}
{{- fail "hub.modelRoute.binaries must name the programs of hub.worker.image that may send the model route's key, by the path that their links resolve to, such as the worker_interpreter that deploy/qualify-kubernetes-worker.py images reports" -}}
{{- end -}}
{{- /* /agnhost is the program of the agnhost stand-in worker image of values-kind.yaml. */ -}}
{{- if and (has "/agnhost" $route.binaries) (not (hasPrefix "registry.k8s.io/e2e-test-images/agnhost:" (toString $worker.image))) -}}
{{- fail "hub.modelRoute.binaries names /agnhost, the program of the stand-in worker image, while hub.worker.image is another image; pass the worker image's interpreter in hub.modelRoute.binaries" -}}
{{- end -}}
{{- $hostedWorker := dict "image" (required "hub.worker.image must name the worker image by digest" $worker.image) "policy" $worker.policy "cpu" $worker.cpu "memory" $worker.memory -}}
{{- $litellm := printf "https://litellm.%s.svc.cluster.local:4000" .Release.Namespace -}}
{{- $routeModels := list -}}
{{- range .Values.inference.models -}}
{{- $routeModels = append $routeModels (dict "name" .name "max_input_tokens" .maxInputTokens "max_output_tokens" .maxOutputTokens "supports_tool_calls" (.supportsToolCalls | default false)) -}}
{{- end -}}
{{- $workerModel := $route.model | default (index (.Values.inference.models | default (list (dict "name" ""))) 0).name -}}
{{- $handling := dict "destination" $route.dataHandling.destination "retention_authority" $route.dataHandling.retentionAuthority "route" $route.dataHandling.route -}}
{{- $modelRoute := dict "profile_id" $route.profileId "model" $workerModel "endpoint" (printf "%s/v1/chat/completions" $litellm) "provider" $route.provider "placeholder_env" $route.placeholderEnv "binaries" $route.binaries "data_handling" $handling -}}
{{- $inference := dict "session_reservation" .Values.control.inference.sessionReservation "litellm_url" $litellm "master_key_file" "/etc/heartwood-control/litellm/master-key" "models" $routeModels "settle_wait_seconds" .Values.inference.settleWaitSeconds "openshell_cli" "/usr/local/bin/openshell" -}}
{{- $hosted := dict "control_url" (printf "https://heartwood-control.%s.svc.cluster.local:8443" .Release.Namespace) "worker" $hostedWorker "model_route" $modelRoute -}}
{{- $redirect := printf "%s/user/{researcher}/{project}/oauth_callback" .Values.hub.publicOrigin -}}
{{- /* Project data volumes are attached to the sandboxes of the hosted gateways' workspace, research. */ -}}
{{- $store := include "heartwood.selector" (dict "context" . "component" "versitygw") | fromYaml -}}
{{- $projectData := dict "data_url" (printf "https://heartwood-data.%s.svc.cluster.local:8443" .Release.Namespace) "token_file" "/var/run/secrets/heartwood/data/token" "copy_image" .Values.images.platformServices "storage_class" "heartwood-project-data" "workspace" "research" "mount_path" "/data" "object_store_namespace" .Release.Namespace "object_store_labels" $store "object_store_port" 7070 -}}
{{- dict "project_data" $projectData "tls" $tls "hosted" $hosted "synthetic_prices" $syntheticPrices "sessions" $sessions "platform_id" .Values.control.platformId "database" "/var/lib/heartwood-control/control.sqlite3" "audience" "heartwood-control" "service_callers" .Values.control.serviceCallers "operator_callers" .Values.control.operatorCallers "redirect_uri_template" $redirect "researcher_id_key_file" "/etc/heartwood-control/researcher-ids/key" "inference" $inference "keycloak" $keycloak "projects" $projects | toPrettyJson -}}
{{- end }}
# The key under which hosted gateways derive the actor that records name for a
# researcher. Losing it breaks the link between earlier and later records of the same
# researcher, and replacing it changes every researcher's actor; back it up with the
# deployment's other credentials. An existing Secret keeps its value on upgrade, and
# uninstalling the chart leaves it in place.
apiVersion: v1
kind: Secret
metadata:
  name: heartwood-actor-key
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
type: Opaque
data:
  actor-key: {{ include "heartwood.credential" (dict "context" . "name" "heartwood-actor-key" "key" "actor-key") }}
---
# The key of the researcher identifiers, which name researchers in the control
# service's paths, the Hub's user names, the gateways' base paths and the redirect URIs
# instead of their subjects. Replacing it renames every researcher, so their existing
# servers and sessions are no longer reached under the new names. An existing Secret
# keeps its value on upgrade, and uninstalling the chart leaves it in place.
apiVersion: v1
kind: Secret
metadata:
  name: heartwood-researcher-ids
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
type: Opaque
data:
  key: {{ include "heartwood.credential" (dict "context" . "name" "heartwood-researcher-ids" "key" "key") }}
---
# The registry and the settings of the control service. It holds no credential.
apiVersion: v1
kind: ConfigMap
metadata:
  name: heartwood-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
data:
  configuration.json: |
    {{- include "heartwood.controlConfiguration" . | nindent 4 }}
---
# The OpenShell objects that the control service applies in each session namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: heartwood-control-openshell
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
data:
  openshell-session.json: |
    {{- .Files.Get "files/openshell-session.json" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: heartwood-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "heartwood.selector" (dict "context" . "component" "control") | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: https
---
# One replica: the registry is one SQLite database, and updates of a Keycloak client
# are serialized inside the process.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: heartwood-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  serviceName: heartwood-control
  replicas: 1
  selector:
    matchLabels:
      {{- include "heartwood.selector" (dict "context" . "component" "control") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heartwood.selector" (dict "context" . "component" "control") | nindent 8 }}
      annotations:
        checksum/configuration: {{ include "heartwood.controlConfiguration" . | sha256sum }}
        checksum/openshell: {{ .Files.Get "files/openshell-session.json" | sha256sum }}
    spec:
      serviceAccountName: heartwood-control
      # The service reviews the tokens of its callers and provisions session namespaces
      # through the Kubernetes API.
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        {{- include "heartwood.podSecurityContext" 65532 | nindent 8 }}
      containers:
        - name: control
          image: {{ .Values.images.platformServices }}
          args: [heartwood_platform.control, /etc/heartwood-control/configuration.json]
          securityContext:
            {{- include "heartwood.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          # The service serves only HTTPS, with its certificate from the platform CA.
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: configuration
              mountPath: /etc/heartwood-control
              readOnly: true
            - name: keycloak
              mountPath: /etc/heartwood-control/keycloak
              readOnly: true
            - name: openshell
              mountPath: /etc/heartwood-control/openshell
              readOnly: true
            - name: tls
              mountPath: /etc/heartwood-control/tls
              readOnly: true
            - name: platform-ca
              mountPath: /etc/heartwood-control/platform-ca
              readOnly: true
            - name: actor-key
              mountPath: /etc/heartwood-control/actor-key
              readOnly: true
            - name: researcher-ids
              mountPath: /etc/heartwood-control/researcher-ids
              readOnly: true
            - name: litellm
              mountPath: /etc/heartwood-control/litellm
              readOnly: true
            - name: data
              mountPath: /var/lib/heartwood-control
            - name: tmp
              mountPath: /tmp
            - name: data-token
              mountPath: /var/run/secrets/heartwood/data
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: heartwood-control
        - name: keycloak
          secret:
            secretName: heartwood-control-keycloak
        # The LiteLLM master key, with which the service manages the sessions' keys.
        - name: litellm
          secret:
            secretName: litellm
            items:
              - key: master-key
                path: master-key
        - name: openshell
          configMap:
            name: heartwood-control-openshell
        # The serving certificate, which the service reloads when the Secret changes.
        - name: tls
          secret:
            secretName: heartwood-control-tls
        # The platform CA certificate, which the service trusts for Keycloak and copies
        # into each session namespace for the supervisors of its sandboxes.
        - name: platform-ca
          configMap:
            name: platform-ca
            items:
              - key: ca.crt
                path: ca.crt
        # The actor key, which the service copies into each hosted gateway's Secret.
        - name: actor-key
          secret:
            secretName: heartwood-actor-key
        # The key under which the service matches researcher identifiers to subjects.
        - name: researcher-ids
          secret:
            secretName: heartwood-researcher-ids
        # In memory: the service copies its serving key here when it reloads it, and keeps
        # the registrations of session OpenShell gateways here while it manages providers.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        # The control service's token for the data service, which plans project data volumes.
        - name: data-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: heartwood-data
                  expirationSeconds: 3600
                  path: token
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "heartwood.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.control.storage }}
