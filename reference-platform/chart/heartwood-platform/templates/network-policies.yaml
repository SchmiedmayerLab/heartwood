{{- /* Every platform namespace denies ingress by default. The rules below allow the flows the components need. */ -}}
{{- range $namespace := list .Release.Namespace .Values.sessions.namespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ $namespace }}
  labels:
    {{- include "heartwood.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heartwood.selector" (dict "context" . "component" "postgresql") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "heartwood.selector" (dict "context" . "component" "keycloak") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heartwood.selector" (dict "context" . "component" "keycloak") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "heartwood.selector" (dict "context" . "component" "keycloak-bootstrap") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "heartwood.selector" (dict "context" . "component" "control") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sessions.namespace }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jupyterhub
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: hub
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: versitygw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heartwood.selector" (dict "context" . "component" "versitygw") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "heartwood.selector" (dict "context" . "component" "versitygw-bootstrap") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 7070
---
# The Hub and the Heartwood gateways call the control service, which verifies every caller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: heartwood-control
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heartwood.selector" (dict "context" . "component" "control") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sessions.namespace }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jupyterhub
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: hub
      ports:
        - protocol: TCP
          port: 8443
---
# The proxy receives researchers' requests from anywhere, and only the Hub configures it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hub-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jupyterhub
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: proxy
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jupyterhub
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: hub
      ports:
        - protocol: TCP
          port: 8001
---
# The proxy forwards to the Hub, and the culler runs inside the Hub's pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jupyterhub
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: hub
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jupyterhub
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: proxy
      ports:
        - protocol: TCP
          port: 8081
---
# A Heartwood gateway receives requests from the proxy, and the Hub checks that it
# answers. Gateways do not reach each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hosted-gateways
  namespace: {{ .Values.sessions.namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      heartwood.platform/role: hosted-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [jupyterhub]
              - key: app.kubernetes.io/instance
                operator: In
                values: [{{ .Release.Name | quote }}]
              - key: app.kubernetes.io/component
                operator: In
                values: [hub, proxy]
      ports:
        - protocol: TCP
          port: 8888
