{{- /* Every platform namespace denies ingress by default. The rules below allow the flows the components need. */ -}}
{{- range $namespace := list .Release.Namespace .Values.sessions.namespace }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ $namespace }}
  labels:
    {{- include "heartwood.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heartwood.selector" (dict "context" . "component" "postgresql") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "heartwood.selector" (dict "context" . "component" "keycloak") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heartwood.selector" (dict "context" . "component" "keycloak") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "heartwood.selector" (dict "context" . "component" "keycloak-bootstrap") | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sessions.namespace }}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: versitygw
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heartwood.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "heartwood.selector" (dict "context" . "component" "versitygw") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "heartwood.selector" (dict "context" . "component" "versitygw-bootstrap") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 7070
