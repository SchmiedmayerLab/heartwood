extends: default

# Helm templates are not YAML until they are rendered, and the Funnel Job templates
# are not YAML until Funnel renders them.
ignore:
  - reference-platform/chart/heartwood-platform/templates/
  - reference-platform/chart/heartwood-platform/files/funnel/

rules:
  line-length:
    max: 150
    level: warning
  truthy:
    level: error
    allowed-values: ["false", "true", "on"]  # Allow GitHub Actions workflow triggers using `on`.
  document-start: disable
  # Dependabot writes the version of a pinned action as ` # vX` after one space.
  comments:
    min-spaces-from-content: 1
